name: Publish Codex plugin
description: Prepare one Codex plugin archive and optionally upload it to a GitHub Release.

inputs:
  test-mode:
    description: Prepare the real archive without uploading it or requiring publication credentials.
    required: false
    default: 'false'
  plugin-directory:
    description: Codex plugin root to archive, relative to the workspace or absolute.
    required: false
    default: .
  archive-name:
    description: Filename for the release archive; must end in .tar.gz.
    required: true
  dependency-policy:
    description: Rebuild production dependencies or exclude node_modules from the archive.
    required: false
    default: include-production
  bun-version:
    description: Bun version used when dependency-policy is include-production.
    required: false
    default: 1.3.14
  release-tag:
    description: Existing GitHub Release tag that receives the archive.
    required: true
  repository:
    description: GitHub repository containing the release.
    required: false
    default: ${{ github.repository }}
  github-token:
    description: GitHub token with contents write access for live upload; omit in test mode.
    required: false

outputs:
  archive-path:
    description: Absolute path to the prepared release archive.
    value: ${{ steps.archive.outputs.archive-path }}
  archive-name:
    description: Filename of the prepared release archive.
    value: ${{ steps.inputs.outputs.archive-name }}

runs:
  using: composite
  steps:
    - id: inputs
      name: Validate archive inputs
      shell: bash
      env:
        ARCHIVE_NAME: ${{ inputs.archive-name }}
        DEPENDENCY_POLICY: ${{ inputs.dependency-policy }}
        PLUGIN_DIRECTORY: ${{ inputs.plugin-directory }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        REPOSITORY: ${{ inputs.repository }}
        TEST_MODE: ${{ inputs.test-mode }}
      run: |
        set -euo pipefail

        if [[ "$TEST_MODE" != "true" && "$TEST_MODE" != "false" ]]; then
          echo "::error::test-mode must be true or false"
          exit 1
        fi
        if [[ "$DEPENDENCY_POLICY" != "include-production" && "$DEPENDENCY_POLICY" != "exclude-node-modules" ]]; then
          echo "::error::dependency-policy must be include-production or exclude-node-modules"
          exit 1
        fi
        if [[ ! "$ARCHIVE_NAME" =~ ^[A-Za-z0-9._-]+\.tar\.gz$ ]]; then
          echo "::error::archive-name must use letters, digits, dots, underscores, or hyphens and end in .tar.gz"
          exit 1
        fi
        if [[ -z "$RELEASE_TAG" ]]; then
          echo "::error::release-tag must not be empty"
          exit 1
        fi
        if [[ -z "$REPOSITORY" ]]; then
          echo "::error::repository must not be empty"
          exit 1
        fi
        if [[ ! -d "$PLUGIN_DIRECTORY" ]]; then
          echo "::error::plugin-directory does not exist: $PLUGIN_DIRECTORY"
          exit 1
        fi

        plugin_path="$(cd "$PLUGIN_DIRECTORY" && pwd -P)"
        echo "archive-name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
        echo "plugin-path=$plugin_path" >> "$GITHUB_OUTPUT"

    - name: Set up Bun
      if: ${{ inputs.dependency-policy == 'include-production' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install production dependencies
      if: ${{ inputs.dependency-policy == 'include-production' }}
      shell: bash
      working-directory: ${{ steps.inputs.outputs.plugin-path }}
      run: |
        set -euo pipefail

        if [[ ! -f package.json ]]; then
          echo "::error::include-production requires package.json in plugin-directory"
          exit 1
        fi
        rm -rf node_modules
        bun install --production --frozen-lockfile --ignore-scripts

    - id: archive
      name: Prepare release archive
      shell: bash
      env:
        ARCHIVE_NAME: ${{ steps.inputs.outputs.archive-name }}
        DEPENDENCY_POLICY: ${{ inputs.dependency-policy }}
        PLUGIN_PATH: ${{ steps.inputs.outputs.plugin-path }}
      run: |
        set -euo pipefail

        archive_path="$RUNNER_TEMP/$ARCHIVE_NAME"
        tar_args=(--exclude-vcs)
        if [[ "$DEPENDENCY_POLICY" == "exclude-node-modules" ]]; then
          tar_args+=(--exclude='./node_modules')
        fi

        tar "${tar_args[@]}" -czf "$archive_path" -C "$PLUGIN_PATH" .
        test -f "$archive_path"
        echo "archive-path=$archive_path" >> "$GITHUB_OUTPUT"

    - name: Upload release archive
      if: ${{ inputs.test-mode != 'true' }}
      shell: bash
      env:
        ARCHIVE_PATH: ${{ steps.archive.outputs.archive-path }}
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail

        if [[ -z "$GH_TOKEN" ]]; then
          echo "::error::github-token is required for live publication"
          exit 1
        fi
        gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH" --repo "$REPOSITORY" --clobber
