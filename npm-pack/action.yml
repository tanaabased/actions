name: Pack npm package
description: Pack one npm package and expose the resulting tarball and package metadata.

inputs:
  debug:
    description: Action and npm verbosity; auto follows RUNNER_DEBUG=1.
    required: false
    default: auto
  package-directory:
    description: Directory containing the package manifest, relative to the workspace or absolute.
    required: false
    default: .
  node-version:
    description: Node.js version, or auto to discover it from package-directory.
    required: false
    default: auto

outputs:
  tarball-path:
    description: Absolute path to the produced npm tarball.
    value: ${{ steps.pack.outputs.tarball-path }}
  package-name:
    description: Package name recorded in the tarball.
    value: ${{ steps.pack.outputs.package-name }}
  package-version:
    description: Package version recorded in the tarball.
    value: ${{ steps.pack.outputs.package-version }}

runs:
  using: composite
  steps:
    - id: debug
      name: Resolve debug mode
      shell: bash
      env:
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        effective_debug="$(bash "$GITHUB_ACTION_PATH/../.lib/resolve-debug.sh" "$DEBUG_INPUT")"
        echo "enabled=$effective_debug" >> "$GITHUB_OUTPUT"
        [[ "$effective_debug" != 'true' ]] || echo 'Diagnostics enabled for npm package packing.'

    - name: Set up Node.js
      uses: $/setup-node
      with:
        debug: ${{ inputs.debug }}
        working-directory: ${{ inputs.package-directory }}
        node-version: ${{ inputs.node-version }}

    - id: pack
      name: Pack package
      shell: bash
      env:
        NPM_CONFIG_LOGLEVEL: ${{ steps.debug.outputs.enabled == 'true' && 'verbose' || 'error' }}
        PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
      run: |
        set -euo pipefail

        package_root="$(cd "$PACKAGE_DIRECTORY" && pwd -P)"
        pack_dir="$(mktemp -d "$RUNNER_TEMP/npm-pack.XXXXXX")"
        pack_json="$pack_dir/pack.json"
        trap 'rm -rf "$pack_dir"' EXIT

        (
          cd "$package_root"
          npm pack --dry-run=false --ignore-scripts --json --pack-destination "$pack_dir" > "$pack_json"
        )

        PACK_JSON="$pack_json" PACK_DIR="$pack_dir" node <<'NODE' >> "$GITHUB_OUTPUT"
        const fs = require('node:fs');
        const path = require('node:path');
        const { parsePackResult, packFilename } = require(path.join(process.env.GITHUB_ACTION_PATH, '../.lib/pack-result.cjs'));

        const pack = parsePackResult(fs.readFileSync(process.env.PACK_JSON, 'utf8'));
        const { name, version } = pack;
        if (!name || !version) {
          throw new Error('npm pack did not return package name and version');
        }

        const tarballPath = path.resolve(process.env.PACK_DIR, packFilename(pack));
        process.stdout.write(`tarball-path=${tarballPath}\n`);
        process.stdout.write(`package-name=${name}\n`);
        process.stdout.write(`package-version=${version}\n`);
        NODE
        rm -f "$pack_json"
        trap - EXIT
