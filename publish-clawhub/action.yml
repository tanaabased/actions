name: Publish ClawHub package
description: Publish one code-plugin tarball to ClawHub and wait for a definitive result.

inputs:
  dry-run:
    description: Validate the tarball with ClawHub's native dry run without publication or credentials.
    required: false
    default: 'false'
  debug:
    description: Action and npm verbosity; auto follows RUNNER_DEBUG=1.
    required: false
    default: auto
  tarball:
    description: Code-plugin tarball to publish, relative to the workspace or absolute.
    required: true
  owner:
    description: ClawHub user or organization publisher handle.
    required: true
  clawhub-token:
    description: ClawHub API token used for live publication; omit in dry runs.
    required: false
  tags:
    description: Comma-separated release channels; omit to select automatically from GitHub release status or package SemVer.
    required: false
    default: ''
  source-repo:
    description: Source repository recorded by ClawHub.
    required: false
    default: ${{ github.repository }}
  source-commit:
    description: Source commit recorded by ClawHub.
    required: false
    default: ${{ github.sha }}
  wait-timeout:
    description: Maximum seconds to wait for a definitive live publication result.
    required: false
    default: '1800'
  working-directory:
    description: Project directory for automatic runtime selection, relative to the workspace or absolute.
    required: false
    default: ${{ github.workspace }}
  node-version:
    description: Node.js version used to install and run the ClawHub CLI.
    required: false
    default: auto
  clawhub-version:
    description: ClawHub CLI version installed for publication.
    required: false
    default: 0.23.3

outputs:
  tarball-path:
    description: Absolute path to the supplied tarball.
    value: ${{ steps.inputs.outputs.tarball-path }}

runs:
  using: composite
  steps:
    - id: debug
      name: Resolve debug mode
      shell: bash
      env:
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        effective_debug="$(bash "$GITHUB_ACTION_PATH/../.lib/resolve-debug.sh" "$DEBUG_INPUT")"
        echo "enabled=$effective_debug" >> "$GITHUB_OUTPUT"
        [[ "$effective_debug" != 'true' ]] || echo 'Diagnostics enabled for ClawHub publication; ClawHub provides no supported verbosity control.'

    - name: Set up Node.js
      uses: $/setup-node
      with:
        debug: ${{ inputs.debug }}
        working-directory: ${{ inputs.working-directory }}
        node-version: ${{ inputs.node-version }}

    - name: Install ClawHub CLI
      shell: bash
      env:
        CLAWHUB_VERSION: ${{ inputs.clawhub-version }}
        NPM_CONFIG_LOGLEVEL: ${{ steps.debug.outputs.enabled == 'true' && 'verbose' || 'error' }}
      run: npm install --global "clawhub@$CLAWHUB_VERSION"

    - id: inputs
      name: Validate publication inputs
      shell: bash
      env:
        OWNER: ${{ inputs.owner }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        SOURCE_REPO: ${{ inputs.source-repo }}
        TAGS: ${{ inputs.tags }}
        TARBALL: ${{ inputs.tarball }}
        DRY_RUN: ${{ inputs.dry-run }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      run: |
        set -euo pipefail

        tarball_path="$(node -e "process.stdout.write(require('node:path').resolve(process.argv[1]))" "$TARBALL")"
        if [[ ! -f "$tarball_path" ]]; then
          echo "::error::ClawHub tarball does not exist: $tarball_path"
          exit 1
        fi

        for input_name in OWNER SOURCE_REPO SOURCE_COMMIT; do
          if [[ -z "${!input_name}" ]]; then
            echo "::error::${input_name,,} must not be empty"
            exit 1
          fi
        done

        if [[ "$DRY_RUN" != "true" && "$DRY_RUN" != "false" ]]; then
          echo "::error::dry-run must be true or false"
          exit 1
        fi
        if [[ ! "$WAIT_TIMEOUT" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::wait-timeout must be a positive integer number of seconds"
          exit 1
        fi

        echo "tarball-path=$tarball_path" >> "$GITHUB_OUTPUT"
        echo "explicit-tags=$TAGS" >> "$GITHUB_OUTPUT"

    - id: tags
      name: Resolve publication tags
      shell: bash
      env:
        ACTION_DEBUG: ${{ steps.debug.outputs.enabled }}
        GH_ENTERPRISE_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        RELEASE_NODE_ID: ${{ github.event.release.node_id }}
        EXPLICIT_TAGS: ${{ steps.inputs.outputs.explicit-tags }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if [[ -n "$EXPLICIT_TAGS" ]]; then
          tags="$EXPLICIT_TAGS"
        else
          promote_both=true
          if [[ "$GITHUB_EVENT_NAME" == 'release' ]]; then
            if [[ -z "$RELEASE_NODE_ID" ]]; then
              echo "::error::release event is missing its GitHub node ID"
              exit 1
            fi
            query='query($id: ID!) { node(id: $id) { __typename ... on Release { isLatest isPrerelease } } }'
            if ! response="$(gh api graphql --hostname "$(node -p 'new URL(process.argv[1]).host' "$GITHUB_SERVER_URL")" -f "query=$query" -F "id=$RELEASE_NODE_ID")"; then
              echo "::error::Unable to resolve authoritative GitHub release status"
              exit 1
            fi
            if ! promote_both="$(RESPONSE="$response" node -e 'const r=JSON.parse(process.env.RESPONSE);const s=r.data?.node;if(r.errors?.length||s?.__typename!=="Release"||typeof s.isLatest!=="boolean"||typeof s.isPrerelease!=="boolean")process.exit(1);process.stdout.write(String(s.isLatest&&!s.isPrerelease))')"; then
              echo "::error::GitHub did not return a valid release status"
              exit 1
            fi
          else
            version="$(node -p 'require(require("node:path").resolve(process.argv[1], "package.json")).version' "$WORKING_DIRECTORY")"
            version_without_build="${version%%+*}"
            if [[ "$version_without_build" == *-* ]]; then promote_both=false; fi
          fi
          if [[ "$promote_both" == true ]]; then tags='latest,edge'; else tags='edge'; fi
        fi

        if [[ -z "$tags" ]]; then
          echo '::error::tags must not be empty'
          exit 1
        fi
        echo "tags=$tags" >> "$GITHUB_OUTPUT"
        if [[ "$ACTION_DEBUG" == 'true' ]]; then echo "Resolved ClawHub tags: $tags"; fi

    - id: config
      name: Prepare isolated ClawHub configuration
      shell: bash
      run: |
        set -euo pipefail

        config_root="$(mktemp -d "$RUNNER_TEMP/publish-clawhub.XXXXXX")"
        echo "config-path=$config_root/config.json" >> "$GITHUB_OUTPUT"
        echo "config-root=$config_root" >> "$GITHUB_OUTPUT"

    - name: Authenticate with ClawHub
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        CLAWHUB_CONFIG_PATH: ${{ steps.config.outputs.config-path }}
        CLAWHUB_TOKEN: ${{ inputs.clawhub-token }}
      run: |
        set -euo pipefail

        if [[ -z "$CLAWHUB_TOKEN" ]]; then
          echo "::error::clawhub-token is required for live publication"
          exit 1
        fi
        echo "::add-mask::$CLAWHUB_TOKEN"
        clawhub --no-input login --token "$CLAWHUB_TOKEN"

    - name: Publish package
      shell: bash
      env:
        CLAWHUB_CONFIG_PATH: ${{ steps.config.outputs.config-path }}
        OWNER: ${{ inputs.owner }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        SOURCE_REPO: ${{ inputs.source-repo }}
        TAGS: ${{ steps.tags.outputs.tags }}
        TARBALL_PATH: ${{ steps.inputs.outputs.tarball-path }}
        DRY_RUN: ${{ inputs.dry-run }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      run: |
        set -euo pipefail

        publish_args=(
          --no-input
          package publish "$TARBALL_PATH"
          --family code-plugin
          --owner "$OWNER"
          --tags "$TAGS"
          --source-repo "$SOURCE_REPO"
          --source-commit "$SOURCE_COMMIT"
        )
        if [[ "$DRY_RUN" == "true" ]]; then
          publish_args+=(--dry-run)
        else
          publish_args+=(--wait --wait-timeout "$WAIT_TIMEOUT")
        fi

        clawhub "${publish_args[@]}"

    - name: Remove temporary ClawHub configuration
      if: always()
      shell: bash
      env:
        CONFIG_ROOT: ${{ steps.config.outputs.config-root }}
      run: |
        if [[ -n "$CONFIG_ROOT" && "$CONFIG_ROOT" == "$RUNNER_TEMP"/publish-clawhub.* ]]; then
          rm -rf "$CONFIG_ROOT"
        fi
