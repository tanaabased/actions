name: Publish ClawHub package
description: Publish one code-plugin tarball to ClawHub and wait for a definitive result.

inputs:
  test-mode:
    description: Exercise the action without mutating external state or requiring publication credentials.
    required: false
    default: 'false'
  debug:
    description: Action and npm verbosity; auto follows RUNNER_DEBUG=1.
    required: false
    default: auto
  tarball:
    description: Code-plugin tarball to publish, relative to the workspace or absolute.
    required: true
  owner:
    description: ClawHub user or organization publisher handle.
    required: true
  clawhub-token:
    description: ClawHub API token used for live publication; omit in test mode.
    required: false
  tags:
    description: Comma-separated release channels applied to the publication.
    required: false
    default: latest
  source-repo:
    description: Source repository recorded by ClawHub.
    required: false
    default: ${{ github.repository }}
  source-commit:
    description: Source commit recorded by ClawHub.
    required: false
    default: ${{ github.sha }}
  wait-timeout:
    description: Maximum seconds to wait for a definitive live publication result.
    required: false
    default: '1800'
  working-directory:
    description: Project directory for automatic runtime selection, relative to the workspace or absolute.
    required: false
    default: ${{ github.workspace }}
  node-version:
    description: Node.js version used to install and run the ClawHub CLI.
    required: false
    default: auto
  clawhub-version:
    description: ClawHub CLI version installed for publication.
    required: false
    default: 0.23.3

outputs:
  tarball-path:
    description: Absolute path to the supplied tarball.
    value: ${{ steps.inputs.outputs.tarball-path }}

runs:
  using: composite
  steps:
    - id: debug
      name: Resolve debug mode
      shell: bash
      env:
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        effective_debug="$(bash "$GITHUB_ACTION_PATH/../.lib/resolve-debug.sh" "$DEBUG_INPUT")"
        echo "enabled=$effective_debug" >> "$GITHUB_OUTPUT"
        [[ "$effective_debug" != 'true' ]] || echo 'Diagnostics enabled for ClawHub publication; ClawHub provides no supported verbosity control.'

    - name: Set up Node.js
      uses: $/setup-node
      with:
        test-mode: ${{ inputs.test-mode }}
        debug: ${{ inputs.debug }}
        working-directory: ${{ inputs.working-directory }}
        node-version: ${{ inputs.node-version }}

    - name: Install ClawHub CLI
      shell: bash
      env:
        CLAWHUB_VERSION: ${{ inputs.clawhub-version }}
        NPM_CONFIG_LOGLEVEL: ${{ steps.debug.outputs.enabled == 'true' && 'verbose' || 'error' }}
      run: npm install --global "clawhub@$CLAWHUB_VERSION"

    - id: inputs
      name: Validate publication inputs
      shell: bash
      env:
        OWNER: ${{ inputs.owner }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        SOURCE_REPO: ${{ inputs.source-repo }}
        TAGS: ${{ inputs.tags }}
        TARBALL: ${{ inputs.tarball }}
        TEST_MODE: ${{ inputs.test-mode }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        ACTION_DEBUG: ${{ steps.debug.outputs.enabled }}
      run: |
        set -euo pipefail

        tarball_path="$(node -e "process.stdout.write(require('node:path').resolve(process.argv[1]))" "$TARBALL")"
        if [[ ! -f "$tarball_path" ]]; then
          echo "::error::ClawHub tarball does not exist: $tarball_path"
          exit 1
        fi

        for input_name in OWNER TAGS SOURCE_REPO SOURCE_COMMIT; do
          if [[ -z "${!input_name}" ]]; then
            echo "::error::${input_name,,} must not be empty"
            exit 1
          fi
        done

        if [[ "$TEST_MODE" != "true" && "$TEST_MODE" != "false" ]]; then
          echo "::error::test-mode must be true or false"
          exit 1
        fi
        if [[ ! "$WAIT_TIMEOUT" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::wait-timeout must be a positive integer number of seconds"
          exit 1
        fi

        echo "tarball-path=$tarball_path" >> "$GITHUB_OUTPUT"
        if [[ "$ACTION_DEBUG" == 'true' ]]; then
          echo "Validated ClawHub package for $OWNER with $(tr ',' '\n' <<< "$TAGS" | wc -l | tr -d ' ') tag selection(s)."
        fi

    - id: config
      name: Prepare isolated ClawHub configuration
      shell: bash
      run: |
        set -euo pipefail

        config_root="$(mktemp -d "$RUNNER_TEMP/publish-clawhub.XXXXXX")"
        echo "config-path=$config_root/config.json" >> "$GITHUB_OUTPUT"
        echo "config-root=$config_root" >> "$GITHUB_OUTPUT"

    - name: Authenticate with ClawHub
      if: ${{ inputs.test-mode != 'true' }}
      shell: bash
      env:
        CLAWHUB_CONFIG_PATH: ${{ steps.config.outputs.config-path }}
        CLAWHUB_TOKEN: ${{ inputs.clawhub-token }}
      run: |
        set -euo pipefail

        if [[ -z "$CLAWHUB_TOKEN" ]]; then
          echo "::error::clawhub-token is required for live publication"
          exit 1
        fi
        echo "::add-mask::$CLAWHUB_TOKEN"
        clawhub --no-input login --token "$CLAWHUB_TOKEN"

    - name: Publish package
      shell: bash
      env:
        CLAWHUB_CONFIG_PATH: ${{ steps.config.outputs.config-path }}
        OWNER: ${{ inputs.owner }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        SOURCE_REPO: ${{ inputs.source-repo }}
        TAGS: ${{ inputs.tags }}
        TARBALL_PATH: ${{ steps.inputs.outputs.tarball-path }}
        TEST_MODE: ${{ inputs.test-mode }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      run: |
        set -euo pipefail

        publish_args=(
          --no-input
          package publish "$TARBALL_PATH"
          --family code-plugin
          --owner "$OWNER"
          --tags "$TAGS"
          --source-repo "$SOURCE_REPO"
          --source-commit "$SOURCE_COMMIT"
        )
        if [[ "$TEST_MODE" == "true" ]]; then
          publish_args+=(--dry-run)
        else
          publish_args+=(--wait --wait-timeout "$WAIT_TIMEOUT")
        fi

        clawhub "${publish_args[@]}"

    - name: Remove temporary ClawHub configuration
      if: always()
      shell: bash
      env:
        CONFIG_ROOT: ${{ steps.config.outputs.config-root }}
      run: |
        if [[ -n "$CONFIG_ROOT" && "$CONFIG_ROOT" == "$RUNNER_TEMP"/publish-clawhub.* ]]; then
          rm -rf "$CONFIG_ROOT"
        fi
