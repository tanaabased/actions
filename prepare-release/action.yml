name: Prepare release
description: Prepare release files without publishing Git changes.

inputs:
  debug:
    description: Action diagnostics; auto follows RUNNER_DEBUG=1.
    required: false
    default: auto
  version:
    description: Semver-valid release version.
    required: false
    default: ${{ github.event.release.tag_name }}
  release-date:
    description: Release date or timestamp used in CHANGELOG.md.
    required: false
    default: ${{ github.event.release.published_at }}
  release-url:
    description: Release URL used in CHANGELOG.md.
    required: false
    default: ${{ github.event.release.html_url }}
  commands:
    description: Commands that prepare project-specific release files.
    required: false
  root:
    description: Root of the project being prepared.
    required: false
    default: ${{ github.workspace }}
  bun-version:
    description: Bun version to install, or auto to resolve it from the project.
    required: false
    default: auto

outputs:
  resolved-version:
    description: Semver-valid version resolved for this release.
    value: ${{ steps.prepare.outputs.resolved-version }}

runs:
  using: composite
  steps:
    - id: debug
      name: Resolve debug mode
      shell: bash
      env:
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        effective_debug="$(bash "$GITHUB_ACTION_PATH/../.lib/resolve-debug.sh" "$DEBUG_INPUT")"
        echo "enabled=$effective_debug" >> "$GITHUB_OUTPUT"
        [[ "$effective_debug" != 'true' ]] || echo 'Diagnostics enabled for release preparation; the upstream preparation action has no debug input.'

    - id: release-date
      name: Format release date
      shell: bash
      env:
        RELEASE_DATE: ${{ inputs.release-date }}
      run: |
        node <<'NODE' >> "$GITHUB_OUTPUT"
        const value = process.env.RELEASE_DATE;
        const date = new Date(value);
        if (!value || Number.isNaN(date.getTime())) {
          throw new Error('release-date must be a valid date or timestamp');
        }
        const formatted = new Intl.DateTimeFormat('en-US', {
          day: 'numeric',
          month: 'long',
          timeZone: 'UTC',
          year: 'numeric',
        }).format(date);
        process.stdout.write(`value=${formatted}\n`);
        NODE

    - id: runtime
      name: Set up project Bun
      uses: $/setup-bun
      with:
        bun-version: ${{ inputs.bun-version }}
        working-directory: ${{ inputs.root }}
        debug: ${{ inputs.debug }}

    - id: prepare
      name: Prepare release
      uses: tanaabased/prepare-release-action@v1
      with:
        bun-version: ${{ steps.runtime.outputs.bun-version }}
        commands: ${{ inputs.commands }}
        root: ${{ inputs.root }}
        sync: false
        update-files: CHANGELOG.md
        update-files-header: |
          ## {{ UNRELEASED_VERSION }} - [{{ UNRELEASED_DATE }}]({{ UNRELEASED_LINK }})
        update-files-meta: |
          UNRELEASED_DATE=${{ steps.release-date.outputs.value }}
          UNRELEASED_LINK=${{ inputs.release-url }}
          UNRELEASED_VERSION=${{ inputs.version }}
        version: ${{ inputs.version }}
