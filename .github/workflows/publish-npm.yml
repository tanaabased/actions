name: Publish npm package

on:
  workflow_call:
    inputs:
      package-directory:
        description: Directory containing the package manifest.
        default: .
        required: false
        type: string
      registry-url:
        description: npm-compatible registry URL.
        default: https://registry.npmjs.org
        required: false
        type: string
    secrets:
      npm-token:
        description: Token authorized to publish the package.
        required: true
    outputs:
      package-version:
        description: Published package version from package.json.
        value: ${{ jobs.publish.outputs.package-version }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: ${{ inputs.registry-url }}
      - id: package
        name: Read package version
        working-directory: ${{ inputs.package-directory }}
        run: echo "version=$(node --print \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Publish package
        working-directory: ${{ inputs.package-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: npm publish
