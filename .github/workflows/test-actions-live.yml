name: Live action tests

on:
  push:
    branches-ignore:
      - release-action-test/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    name: actions/publish-npm
    runs-on: ubuntu-24.04
    concurrency:
      group: npm-package-test-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_NAME: '@tanaabased/actions-npm-fixture'
      PRERELEASE_VERSION: 0.${{ github.run_id }}.${{ github.run_attempt }}-edge
      REGISTRY_URL: https://npm.pkg.github.com
      STABLE_VERSION: 0.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set prerelease fixture version
        working-directory: tests/fixtures/npm
        run: npm pkg set "version=$PRERELEASE_VERSION"
      - name: Pack prerelease fixture
        id: prerelease-pack
        uses: ./actions/npm-pack
        with:
          package-directory: tests/fixtures/npm
      - name: Publish prerelease fixture
        id: prerelease
        uses: ./actions/publish-npm
        with:
          registry-token: ${{ github.token }}
          registry-url: ${{ env.REGISTRY_URL }}
          tarball: ${{ steps.prerelease-pack.outputs.tarball-path }}
      - name: Configure authenticated package checks
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: ${{ env.REGISTRY_URL }}
          scope: '@tanaabased'
      - name: Verify prerelease result
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PUBLISHED_CHANNEL: ${{ steps.prerelease.outputs.channel }}
          PUBLISHED_NAME: ${{ steps.prerelease.outputs.package-name }}
          PUBLISHED_TYPE: ${{ steps.prerelease.outputs.release-type }}
          PUBLISHED_VERSION: ${{ steps.prerelease.outputs.package-version }}
        run: |
          test "$PUBLISHED_NAME" = "$PACKAGE_NAME"
          test "$PUBLISHED_VERSION" = "$PRERELEASE_VERSION"
          test "$PUBLISHED_CHANNEL" = edge
          test "$PUBLISHED_TYPE" = prerelease

          edge=
          for attempt in {1..10}; do
            edge="$(npm view "$PACKAGE_NAME" dist-tags.edge --json --registry "$REGISTRY_URL" 2>/dev/null || true)"
            if [[ "$edge" = "\"$PRERELEASE_VERSION\"" ]]; then
              break
            fi
            if [[ $attempt -eq 10 ]]; then
              echo "::error::Expected edge=$PRERELEASE_VERSION after publication; received ${edge:-<empty>}."
              exit 1
            fi
            sleep "$attempt"
          done
      - name: Set stable fixture version
        working-directory: tests/fixtures/npm
        run: npm pkg set "version=$STABLE_VERSION"
      - name: Pack stable fixture
        id: stable-pack
        uses: ./actions/npm-pack
        with:
          package-directory: tests/fixtures/npm
      - name: Publish stable fixture and update edge
        id: stable
        uses: ./actions/publish-npm
        with:
          channel-token: ${{ github.token }}
          registry-token: ${{ github.token }}
          registry-url: ${{ env.REGISTRY_URL }}
          tarball: ${{ steps.stable-pack.outputs.tarball-path }}
          update-prerelease-tag-on-stable: true
      - name: Verify stable result
        env:
          PUBLISHED_CHANNEL: ${{ steps.stable.outputs.channel }}
          PUBLISHED_NAME: ${{ steps.stable.outputs.package-name }}
          PUBLISHED_TYPE: ${{ steps.stable.outputs.release-type }}
          PUBLISHED_VERSION: ${{ steps.stable.outputs.package-version }}
        run: |
          test "$PUBLISHED_NAME" = "$PACKAGE_NAME"
          test "$PUBLISHED_VERSION" = "$STABLE_VERSION"
          test "$PUBLISHED_CHANNEL" = latest
          test "$PUBLISHED_TYPE" = stable
      - name: Verify channels and authenticated installs
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          tags=
          for attempt in {1..10}; do
            tags="$(npm view "$PACKAGE_NAME" dist-tags --json --registry "$REGISTRY_URL" 2>/dev/null || true)"
            if TAGS_JSON="$tags" node -e '
              try {
                const tags = JSON.parse(process.env.TAGS_JSON);
                process.exit(tags.latest === process.env.STABLE_VERSION && tags.edge === process.env.STABLE_VERSION ? 0 : 1);
              } catch {
                process.exit(1);
              }
            '; then
              break
            fi
            if [[ $attempt -eq 10 ]]; then
              echo "::error::Expected latest and edge to resolve to $STABLE_VERSION; received ${tags:-<empty>}."
              exit 1
            fi
            sleep "$attempt"
          done

          for version in "$PRERELEASE_VERSION" "$STABLE_VERSION"; do
            consumer="$(mktemp -d)"
            (
              cd "$consumer"
              npm init --yes >/dev/null
              npm install --ignore-scripts --no-audit --no-fund "$PACKAGE_NAME@$version" --registry "$REGISTRY_URL"
              npm list "$PACKAGE_NAME@$version" --depth=0
              node --input-type=module -e "import('$PACKAGE_NAME').then(({ fixture }) => { if (fixture !== 'actions-npm-fixture') process.exit(1) })"
            )
          done
      - name: Reject conflicting package version
        id: conflict
        continue-on-error: true
        uses: ./actions/publish-npm
        with:
          registry-token: ${{ github.token }}
          registry-url: ${{ env.REGISTRY_URL }}
          tarball: ${{ steps.stable-pack.outputs.tarball-path }}
      - name: Verify immutable-version failure
        env:
          CONFLICT_OUTCOME: ${{ steps.conflict.outcome }}
        run: test "$CONFLICT_OUTCOME" = failure

  publish-repo:
    name: actions/publish-repo
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_URL: https://example.invalid/releases/test
      RELEASE_VERSION: v0.0.0-test.${{ github.run_id }}.${{ github.run_attempt }}
      SYNC_BRANCH: release-action-test/${{ github.run_id }}-${{ github.run_attempt }}
      SYNC_TAG: release-action-test-v1-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout action source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create isolated branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/git/refs" --field ref="refs/heads/$SYNC_BRANCH" --field sha="$GITHUB_SHA"
      - name: Checkout isolated branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: test
          ref: ${{ env.SYNC_BRANCH }}
      - name: Publish repository
        uses: ./actions/publish-repo
        with:
          commands: bun -e "await Bun.write('command-output.txt', process.env.PREPARE_RELEASE_VERSION)"
          release-date: 2026-09-16T12:00:00Z
          release-url: ${{ env.RELEASE_URL }}
          root: ${{ github.workspace }}/test
          sync-branch: ${{ env.SYNC_BRANCH }}
          sync-tags: ${{ env.SYNC_TAG }}
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
          version: ${{ env.RELEASE_VERSION }}
      - name: Record first publication
        id: first
        working-directory: test
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify first publication
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: test
        run: |
          branch_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/$SYNC_BRANCH" --jq '.object.sha')"
          version_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_VERSION" --jq '.object.sha')"
          moving_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/$SYNC_TAG" --jq '.object.sha')"
          test "$branch_sha" = "${{ steps.first.outputs.sha }}"
          test "$version_sha" = "$branch_sha"
          test "$moving_sha" = "$branch_sha"
          test "$(gh api "repos/${{ github.repository }}/commits/$branch_sha" --jq '.author.login')" = tanaabot
          test "$(gh api "repos/${{ github.repository }}/commits/$branch_sha" --jq '.commit.verification.verified')" = true
      - name: Checkout isolated branch for retry
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: retry
          ref: ${{ env.SYNC_BRANCH }}
      - name: Retry repository publication
        uses: ./actions/publish-repo
        with:
          commands: bun -e "await Bun.write('command-output.txt', process.env.PREPARE_RELEASE_VERSION)"
          release-date: 2026-09-16T12:00:00Z
          release-url: ${{ env.RELEASE_URL }}
          root: ${{ github.workspace }}/retry
          sync-branch: ${{ env.SYNC_BRANCH }}
          sync-tags: ${{ env.SYNC_TAG }}
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
          version: ${{ env.RELEASE_VERSION }}
      - name: Verify retry result
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: retry
        run: |
          retry_sha="$(git rev-parse HEAD)"
          branch_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/$SYNC_BRANCH" --jq '.object.sha')"
          version_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_VERSION" --jq '.object.sha')"
          moving_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/$SYNC_TAG" --jq '.object.sha')"
          test "$retry_sha" != "${{ steps.first.outputs.sha }}"
          test "$branch_sha" = "$retry_sha"
          test "$version_sha" = "$retry_sha"
          test "$moving_sha" = "$retry_sha"
          test "$(grep --count --fixed-strings "## $RELEASE_VERSION - [September 16, 2026]($RELEASE_URL)" CHANGELOG.md)" = 2
      - name: Remove isolated refs
        if: always() && steps.branch.outcome == 'success'
        run: |
          git push origin --delete "$SYNC_BRANCH" || true
          git push origin --delete "$RELEASE_VERSION" || true
          git push origin --delete "$SYNC_TAG" || true
