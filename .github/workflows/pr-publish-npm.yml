name: Test action / publish-npm

on:
  pull_request:

permissions:
  contents: read

jobs:
  publish-npm:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: stable
            version: 1.2.3
            expected-channel: latest
          - case: prerelease
            version: 1.2.3-next.1
            expected-channel: edge
          - case: preferred-inputs
            version: 1.2.3
            latest_tag: recommended
            edge_tag: next
            expected-channel: recommended
          - case: legacy-inputs
            version: 1.2.3-next.1
            stable_tag: recommended
            prerelease_tag: next
            expected-channel: next
    env:
      PACKAGE_NAME: '@tanaab/actions-publish-npm-fixture'
      PACKAGE_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Verify debug contract
        run: bash .github/scripts/check-debug-contract.sh publish-npm
      - name: Test publication command results
        run: node --test publish-npm/test/publication.test.mjs
      - name: Set fixture version
        working-directory: publish-npm/test/fixture
        run: npm pkg set "version=$PACKAGE_VERSION"
      - name: Pack fixture
        id: pack
        uses: ./npm-pack
        with:
          debug: true
          package-directory: publish-npm/test/fixture
      - name: Validate npm publication
        id: publish
        uses: ./publish-npm
        with:
          dry-run: true
          debug: true
          tarball: ${{ steps.pack.outputs.tarball-path }}
          latest-tag: ${{ matrix.latest_tag }}
          edge-tag: ${{ matrix.edge_tag }}
          stable-tag: ${{ matrix.stable_tag }}
          prerelease-tag: ${{ matrix.prerelease_tag }}
      - name: Verify publication metadata
        env:
          EXPECTED_CHANNEL: ${{ matrix.expected-channel }}
          PACKED_TARBALL: ${{ steps.pack.outputs.tarball-path }}
          PUBLISHED_CHANNEL: ${{ steps.publish.outputs.channel }}
          PUBLISHED_NAME: ${{ steps.publish.outputs.package-name }}
          PUBLISHED_TARBALL: ${{ steps.publish.outputs.tarball-path }}
          PUBLISHED_VERSION: ${{ steps.publish.outputs.package-version }}
        run: |
          test "$PUBLISHED_TARBALL" = "$PACKED_TARBALL"
          test "$PUBLISHED_NAME" = "$PACKAGE_NAME"
          test "$PUBLISHED_VERSION" = "$PACKAGE_VERSION"
          test "$PUBLISHED_CHANNEL" = "$EXPECTED_CHANNEL"
