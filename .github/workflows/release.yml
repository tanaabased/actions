name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish npm catalog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare catalog release
        id: prepare
        uses: ./prepare-release
      - name: Pack catalog
        id: pack
        uses: ./npm-pack
      - name: Verify packed catalog
        env:
          PACKED_NAME: ${{ steps.pack.outputs.package-name }}
          PACKED_VERSION: ${{ steps.pack.outputs.package-version }}
          PREPARED_VERSION: ${{ steps.prepare.outputs.resolved-version }}
          TARBALL_PATH: ${{ steps.pack.outputs.tarball-path }}
        run: |
          set -euo pipefail

          test "$PACKED_NAME" = '@tanaab/actions'
          test "$PACKED_VERSION" = "${PREPARED_VERSION#v}"
          node .github/scripts/check-package-task.mjs "$TARBALL_PATH"
      - name: Publish tested catalog
        uses: ./publish-npm
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          channel-token: ${{ secrets.TANAAB_NPM_DEPLOY }}

  publish-repo:
    name: Publish repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish repository
        uses: ./publish-repo
        with:
          sync-tags: v1
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
