name: PR / setup-agent-system

on:
  pull_request:

permissions:
  contents: read

jobs:
  setup-agent-system:
    name: setup-agent-system (${{ matrix.os }} / ${{ matrix.selection }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
        selection:
          - published
          - source
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Verify debug contract
        run: bash .github/scripts/check-debug-contract.sh setup-agent-system
      - name: Checkout pinned Agent System source
        if: matrix.selection == 'source'
        uses: actions/checkout@v7
        with:
          repository: tanaabased/openclaw-agent-system
          ref: 4fc7dd6abab9d511d4a6a899b65305b74e4eec7b
          path: agent-system-source
      - name: Add source changes
        if: matrix.selection == 'source'
        shell: bash
        run: |
          set -euo pipefail

          source_path="$GITHUB_WORKSPACE/agent-system-source"
          marker="setup-agent-system-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.os }}"
          printf '\n%s\n' "$marker" >> "$source_path/README.md"
          printf '%s\n' "$marker" > "$source_path/assets/setup-agent-system-source-marker.txt"
          {
            echo "SOURCE_MARKER=$marker"
            echo "SOURCE_README_HASH=$(shasum -a 256 "$source_path/README.md" | cut -d ' ' -f 1)"
            echo "SOURCE_MARKER_HASH=$(shasum -a 256 "$source_path/assets/setup-agent-system-source-marker.txt" | cut -d ' ' -f 1)"
          } >> "$GITHUB_ENV"
      - name: Install OpenClaw
        uses: ./setup-openclaw
        with:
          version: 2026.9.3
      - name: Prepare isolated OpenClaw
        shell: bash
        run: |
          set -euo pipefail

          openclaw-setup \
            --profile "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.selection }}" \
            --workspace "$RUNNER_TEMP/setup-agent-system-${{ matrix.selection }}-workspace" \
            --state-dir "$RUNNER_TEMP/setup-agent-system-${{ matrix.selection }}-state"
      - name: Install Agent System
        id: agent-system
        uses: ./setup-agent-system
        with:
          debug: true
          version: ${{ matrix.selection == 'published' && '0.6.0' || '' }}
          source-directory: ${{ matrix.selection == 'source' && 'agent-system-source' || '' }}
          profile: ${{ matrix.selection == 'source' && env.OPENCLAW_PROFILE || '' }}
          config-path: ${{ matrix.selection == 'source' && env.OPENCLAW_CONFIG_PATH || '' }}
          state-directory: ${{ matrix.selection == 'source' && env.OPENCLAW_STATE_DIR || '' }}
      - name: Verify installation and provenance
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.agent-system.outputs.artifact-path }}
          INSTALLED_VERSION: ${{ steps.agent-system.outputs.version }}
          PLUGIN_PATH: ${{ steps.agent-system.outputs.plugin-path }}
          SELECTED_SOURCE: ${{ steps.agent-system.outputs.source }}
          SELECTION: ${{ matrix.selection }}
        run: |
          set -euo pipefail

          test "$INSTALLED_VERSION" = '0.6.0'
          test -f "$ARTIFACT_PATH"
          test -d "$PLUGIN_PATH"
          test "$OPENCLAW_PROFILE" = "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SELECTION"
          shopt -s nullglob
          source_staging=("$RUNNER_TEMP"/setup-agent-system-source.*)
          package_metadata=("$RUNNER_TEMP"/setup-agent-system-package.*)
          ((${#source_staging[@]} == 0))
          ((${#package_metadata[@]} == 0))
          openclaw --profile "$OPENCLAW_PROFILE" agent-system --help | grep --fixed-strings 'validate'

          inspection="$(openclaw --profile "$OPENCLAW_PROFILE" plugins inspect agent-system --runtime --json)"
          printf '%s\n' "$inspection" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const report = JSON.parse(input);
              const ok = report.plugin?.id === "agent-system"
                && report.plugin?.status === "loaded"
                && report.plugin?.enabled === true
                && report.plugin?.version === "0.6.0";
              process.exit(ok ? 0 : 1);
            });
          '

          if [[ "$SELECTION" == 'published' ]]; then
            test "$SELECTED_SOURCE" = 'npm:@tanaab/openclaw-agent-system@0.6.0'
          else
            source_path="$GITHUB_WORKSPACE/agent-system-source"
            test "$SELECTED_SOURCE" = "$source_path"
            test "$(shasum -a 256 "$source_path/README.md" | cut -d ' ' -f 1)" = "$SOURCE_README_HASH"
            test "$(shasum -a 256 "$source_path/assets/setup-agent-system-source-marker.txt" | cut -d ' ' -f 1)" = "$SOURCE_MARKER_HASH"
            test "$(tar -xOf "$ARTIFACT_PATH" package/assets/setup-agent-system-source-marker.txt)" = "$SOURCE_MARKER"
            git -C "$source_path" status --short --untracked-files=all | grep --fixed-strings ' M README.md'
            git -C "$source_path" status --short --untracked-files=all | grep --fixed-strings '?? assets/setup-agent-system-source-marker.txt'
          fi
      - name: Clean prepared artifact
        if: always() && steps.agent-system.outputs.artifact-path != ''
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.agent-system.outputs.artifact-path }}
        run: |
          set -euo pipefail

          case "$ARTIFACT_PATH" in
            "$RUNNER_TEMP"/setup-agent-system-artifact.*/*.tgz) ;;
            *) exit 1 ;;
          esac
          artifact_dir="$(dirname "$ARTIFACT_PATH")"
          rm -rf -- "$artifact_dir"
          test ! -e "$artifact_dir"

  invalid-inputs:
    name: setup-agent-system invalid inputs (${{ matrix.case }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case:
          - both-sources
          - missing-source
          - version-range
          - missing-directory
          - wrong-package
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Reject invalid input
        id: invalid
        continue-on-error: true
        uses: ./setup-agent-system
        with:
          version: ${{ matrix.case == 'both-sources' && '0.6.0' || matrix.case == 'version-range' && '^0.6.0' || '' }}
          source-directory: ${{ matrix.case == 'both-sources' && '.' || matrix.case == 'missing-directory' && 'not-a-directory' || matrix.case == 'wrong-package' && '.' || '' }}
      - name: Verify rejection
        env:
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
        run: test "$INVALID_OUTCOME" = failure
