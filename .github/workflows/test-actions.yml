name: Action tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare-release:
    name: actions/prepare-release
    runs-on: ubuntu-24.04
    env:
      RELEASE_URL: https://example.invalid/releases/test
      RELEASE_VERSION: v0.0.0-test.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare release
        id: prepare
        uses: ./actions/prepare-release
        with:
          commands: bun -e "await Bun.write('command-output.txt', process.env.PREPARE_RELEASE_VERSION)"
          release-date: 2026-09-16T12:00:00Z
          release-url: ${{ env.RELEASE_URL }}
          root: ${{ github.workspace }}/tests/fixtures/release
          version: ${{ env.RELEASE_VERSION }}
      - name: Verify prepared files without a push
        env:
          RESOLVED_VERSION: ${{ steps.prepare.outputs.resolved-version }}
        working-directory: tests/fixtures/release
        run: |
          test "$RESOLVED_VERSION" = "$RELEASE_VERSION"
          test "$(node --print "require('./package.json').version")" = "${RELEASE_VERSION#v}"
          test "$(cat command-output.txt)" = "$RELEASE_VERSION"
          grep --fixed-strings "## $RELEASE_VERSION - [September 16, 2026]($RELEASE_URL)" CHANGELOG.md
          test "$(grep --count --fixed-strings '## {{ UNRELEASED_VERSION }} - [{{ UNRELEASED_DATE }}]({{ UNRELEASED_LINK }})' CHANGELOG.md)" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! git ls-remote --exit-code origin "refs/tags/$RELEASE_VERSION"

  npm-pack:
    name: actions/npm-pack
    runs-on: ubuntu-24.04
    env:
      PACKAGE_NAME: '@tanaabased/actions-npm-fixture'
      PACKAGE_VERSION: 0.${{ github.run_id }}.${{ github.run_attempt }}-pack
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set fixture version
        working-directory: tests/fixtures/npm
        run: npm pkg set "version=$PACKAGE_VERSION"
      - name: Pack fixture
        id: pack
        uses: ./actions/npm-pack
        with:
          package-directory: tests/fixtures/npm
      - name: Verify and install packed artifact
        env:
          PACKED_NAME: ${{ steps.pack.outputs.package-name }}
          PACKED_VERSION: ${{ steps.pack.outputs.package-version }}
          TARBALL_PATH: ${{ steps.pack.outputs.tarball-path }}
        run: |
          test "$PACKED_NAME" = "$PACKAGE_NAME"
          test "$PACKED_VERSION" = "$PACKAGE_VERSION"
          test -f "$TARBALL_PATH"
          test "$(tar -tzf "$TARBALL_PATH" | sort)" = $'package/index.js\npackage/package.json'

          consumer="$(mktemp -d)"
          (
            cd "$consumer"
            npm init --yes >/dev/null
            npm install --ignore-scripts --no-audit --no-fund "$TARBALL_PATH"
            npm list "$PACKAGE_NAME@$PACKAGE_VERSION" --depth=0
            node --input-type=module -e "import('$PACKAGE_NAME').then(({ fixture }) => { if (fixture !== 'actions-npm-fixture') process.exit(1) })"
          )
