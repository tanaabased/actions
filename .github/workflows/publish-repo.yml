name: Publish repository release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing Git tag to publish as a GitHub release.
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease.
        default: false
        required: false
        type: boolean
    secrets:
      token:
        description: Token authorized to create releases in the caller repository.
        required: true
    outputs:
      release-url:
        description: URL of the created or existing release.
        value: ${{ jobs.publish.outputs.release-url }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      release-url: ${{ steps.release.outputs.url }}
    steps:
      - id: release
        name: Create or find release
        env:
          GH_TOKEN: ${{ secrets.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          TAG: ${{ inputs.tag }}
        run: |
          if url="$(gh release view "$TAG" --json url --jq .url 2>/dev/null)"; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          args=(release create "$TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          url="$(gh "${args[@]}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
