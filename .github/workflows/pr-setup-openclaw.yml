name: Test action / setup-openclaw

on:
  pull_request:

permissions:
  contents: read

jobs:
  setup-openclaw:
    name: install / ${{ matrix.os }} / ${{ matrix.selection }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
        selection:
          - explicit
          - auto
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Verify debug contract
        run: bash .github/scripts/check-debug-contract.sh setup-openclaw
      - name: Verify harness contracts
        run: node --test setup-openclaw/test/contracts.test.mjs
      - name: Verify helper ownership and diagnostics
        run: bash setup-openclaw/test/helpers.sh
      - name: Install OpenClaw
        id: openclaw
        uses: ./setup-openclaw
        env:
          RUNNER_DEBUG: '1'
        with:
          debug: ${{ matrix.selection == 'explicit' && 'false' || 'auto' }}
          version: ${{ matrix.selection == 'explicit' && '2026.9.3' || 'auto' }}
          package-json: ${{ matrix.selection == 'explicit' && 'setup-openclaw/test/fixture/conflict-package.json' || 'setup-openclaw/test/fixture/dependency-package.json' }}
      - name: Verify installation and exported commands
        shell: bash
        env:
          EXECUTABLE_PATH: ${{ steps.openclaw.outputs.executable-path }}
          EXPECTED_DEBUG: ${{ matrix.selection == 'explicit' && 'false' || 'true' }}
          HELPER_PATH: ${{ steps.openclaw.outputs.helper-path }}
          GATEWAY_LOG_PATH: ${{ steps.openclaw.outputs.gateway-log-path }}
          RESOLVED_VERSION: ${{ steps.openclaw.outputs.version }}
          SELECTION: ${{ matrix.selection }}
        run: |
          set -euo pipefail

          test "$RESOLVED_VERSION" = '2026.9.3'
          test "$SETUP_OPENCLAW_DEBUG" = "$EXPECTED_DEBUG"
          test "$(command -v openclaw)" = "$EXECUTABLE_PATH"
          test "$(command -v openclaw-setup)" = "$HELPER_PATH/openclaw-setup"
          test "$(command -v openclaw-gateway)" = "$HELPER_PATH/openclaw-gateway"
          test "$(command -v openclaw-diagnostics)" = "$HELPER_PATH/openclaw-diagnostics"
          openclaw --version | grep --fixed-strings "$RESOLVED_VERSION"

          profile="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SELECTION"
          workspace="$RUNNER_TEMP/setup-openclaw-$SELECTION-workspace"
          state_dir="$RUNNER_TEMP/setup-openclaw-$SELECTION-state"
          test "$GATEWAY_LOG_PATH" = "$state_dir/gateway/gateway.log"
          test "$OPENCLAW_GATEWAY_LOG_PATH" = "$GATEWAY_LOG_PATH"
          {
            echo "OPENCLAW_TEST_PROFILE=$profile"
            echo "OPENCLAW_TEST_WORKSPACE=$workspace"
            echo "OPENCLAW_TEST_STATE_DIR=$state_dir"
          } >> "$GITHUB_ENV"

          openclaw-setup \
            --profile "$profile" \
            --workspace "$workspace" \
            --state-dir "$state_dir"
          OPENCLAW_LOG_LEVEL=debug openclaw-gateway start \
            --profile "$profile" \
            --workspace "$workspace" \
            --state-dir "$state_dir" \
            --timeout 90
          test -f "$GATEWAY_LOG_PATH"
          gateway_pid="$(sed -n '1p' "$state_dir/gateway/gateway.pid")"
          echo "OPENCLAW_TEST_GATEWAY_PID=$gateway_pid" >> "$GITHUB_ENV"

      - name: Verify later-step readiness and failure preservation
        shell: bash
        run: |
          set -euo pipefail

          test "$OPENCLAW_PROFILE" = "$OPENCLAW_TEST_PROFILE"
          test "$OPENCLAW_CONFIG_PATH" = "$OPENCLAW_TEST_STATE_DIR/openclaw/openclaw.json"
          test "$OPENCLAW_STATE_DIR" = "$OPENCLAW_TEST_STATE_DIR/openclaw"
          openclaw-gateway wait \
            --profile "$OPENCLAW_TEST_PROFILE" \
            --workspace "$OPENCLAW_TEST_WORKSPACE" \
            --state-dir "$OPENCLAW_TEST_STATE_DIR" \
            --timeout 30

          set +e
          openclaw-diagnostics \
            --profile "$OPENCLAW_TEST_PROFILE" \
            --workspace "$OPENCLAW_TEST_WORKSPACE" \
            --state-dir "$OPENCLAW_TEST_STATE_DIR" \
            --exit-code 23
          diagnostic_status=$?
          set -e
          test "$diagnostic_status" = 23

      - name: Stop isolated gateway
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if command -v openclaw-gateway >/dev/null 2>&1 && [[ -n "${OPENCLAW_TEST_STATE_DIR:-}" ]]; then
            openclaw-gateway stop \
              --profile "$OPENCLAW_TEST_PROFILE" \
              --workspace "$OPENCLAW_TEST_WORKSPACE" \
              --state-dir "$OPENCLAW_TEST_STATE_DIR" \
              --timeout 30
            test ! -f "$OPENCLAW_TEST_STATE_DIR/gateway/gateway.pid"
            if [[ -n "${OPENCLAW_TEST_GATEWAY_PID:-}" ]]; then
              if kill -0 "$OPENCLAW_TEST_GATEWAY_PID" 2>/dev/null; then
                exit 1
              fi
            fi
          fi

  version-resolution:
    name: version-resolution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Verify version selection contract
        shell: bash
        run: |
          set -euo pipefail

          resolver="$GITHUB_WORKSPACE/setup-openclaw/scripts/lib/resolve-openclaw.mjs"
          fixture_dir="$GITHUB_WORKSPACE/setup-openclaw/test/fixture"

          resolve_version() {
            local version="$1"
            local fixture="$2"
            local field="$3"
            node "$resolver" "$version" "$fixture_dir/$fixture" "$field" | sed -n '1p'
          }

          test "$(resolve_version auto package.json '')" = '2026.9.3'
          test "$(resolve_version auto dependency-package.json '')" = '2026.9.3'
          test "$(resolve_version auto matching-package.json '')" = '2026.9.3'
          test "$(resolve_version auto field-package.json 'openclaw.testedVersion')" = '2026.9.3'
          test "$(resolve_version 2026.9.3 conflict-package.json '')" = '2026.9.3'

  invalid-inputs:
    name: invalid-inputs / ${{ matrix.os }} / ${{ matrix.case }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
        case:
          - dist-tag
          - conflict
          - missing
          - peer-only
          - missing-field
          - debug
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Reject invalid input
        id: invalid
        continue-on-error: true
        uses: ./setup-openclaw
        with:
          debug: ${{ matrix.case == 'debug' && 'verbose' || 'false' }}
          version: ${{ matrix.case == 'dist-tag' && 'latest' || 'auto' }}
          package-json: ${{ matrix.case == 'conflict' && 'setup-openclaw/test/fixture/conflict-package.json' || matrix.case == 'missing' && 'setup-openclaw/test/fixture/missing-package.json' || matrix.case == 'peer-only' && 'setup-openclaw/test/fixture/peer-package.json' || 'setup-openclaw/test/fixture/package.json' }}
          package-field: ${{ matrix.case == 'missing-field' && 'dependencies.openclaw' || '' }}
      - name: Verify rejection
        env:
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
        run: test "$INVALID_OUTCOME" = failure

  run-mode:
    name: run / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7
      - name: Install and run caller commands
        id: run
        uses: ./setup-openclaw
        with:
          version: 2026.9.3
          run: |
            command -v openclaw
            command -v openclaw-setup
            openclaw-setup --workspace "$RUNNER_TEMP/scenario-workspace"
            openclaw-gateway start
            openclaw gateway call agents.list --json --timeout 3000
            openclaw-gateway stop
      - name: Verify mode and exported context
        env:
          MODE: ${{ steps.run.outputs.mode }}
          CONFIG: ${{ steps.run.outputs.config-path }}
        run: |
          test "$MODE" = run
          test -f "$CONFIG"
          test "$OPENCLAW_CONFIG_PATH" = "$CONFIG"
      - name: Clean gateway
        if: always()
        run: |
          if test -f "$SETUP_OPENCLAW_STATE_DIR/context"; then openclaw-gateway stop; fi

  agent-system:
    name: agent-system / ${{ matrix.os }} / ${{ matrix.selection }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        selection: [published, source, tarball]
        include:
          - os: ubuntu-24.04
            selection: repository
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned Agent System source
        if: matrix.selection == 'source' || matrix.selection == 'tarball'
        uses: actions/checkout@v7
        with:
          repository: tanaabased/openclaw-agent-system
          ref: 4fc7dd6abab9d511d4a6a899b65305b74e4eec7b
          path: agent-system-source
      - name: Preserve source changes
        if: matrix.selection == 'source'
        run: |
          printf '\nlocal source marker\n' >> agent-system-source/README.md
          printf 'local source marker\n' > agent-system-source/assets/harness-marker.txt
          echo "SOURCE_README_HASH=$(shasum -a 256 agent-system-source/README.md | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Set up package build runtime
        if: matrix.selection == 'tarball'
        uses: ./setup-bun
        with:
          working-directory: agent-system-source
      - name: Prepare local package
        if: matrix.selection == 'tarball'
        working-directory: agent-system-source
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          bun run plugin:check
          archive="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          echo "LOCAL_PACKAGE=$RUNNER_TEMP/$archive" >> "$GITHUB_ENV"
      - name: Prepare unified harness
        if: matrix.selection != 'tarball'
        id: setup
        uses: ./setup-openclaw
        with:
          version: 2026.9.3
          debug: true
          agent-system: ${{ matrix.selection == 'published' && '0.6.0' || matrix.selection == 'source' && './agent-system-source' || matrix.selection == 'tarball' && env.LOCAL_PACKAGE || 'github:tanaabased/openclaw-agent-system#4fc7dd6abab9d511d4a6a899b65305b74e4eec7b' }}
          needs-secret-service: ${{ runner.os == 'Linux' }}
          needs-ssh-key: true
          yolo: true
      - name: Install for later helper use
        if: matrix.selection == 'tarball'
        id: install
        uses: ./setup-openclaw
        with:
          version: 2026.9.3
      - name: Prepare the same harness through the public helper
        if: matrix.selection == 'tarball'
        id: helper
        env:
          MODE: ${{ steps.install.outputs.mode }}
        run: |
          test "$MODE" = install
          secret_service=false
          if [[ "$RUNNER_OS" == Linux ]]; then secret_service=true; fi
          openclaw-setup --agent-system "$LOCAL_PACKAGE" \
            --needs-secret-service "$secret_service" --needs-ssh-key --yolo
          echo 'mode=setup' >> "$GITHUB_OUTPUT"
      - name: Verify installed runtime and fixture outputs
        env:
          MODE: ${{ steps.setup.outputs.mode || steps.helper.outputs.mode }}
          ARTIFACT: ${{ steps.setup.outputs.agent-system-artifact-path || steps.helper.outputs.agent-system-artifact-path }}
          PLUGIN_PATH: ${{ steps.setup.outputs.agent-system-plugin-path || steps.helper.outputs.agent-system-plugin-path }}
          VERSION: ${{ steps.setup.outputs.agent-system-version || steps.helper.outputs.agent-system-version }}
          SOURCE: ${{ steps.setup.outputs.agent-system-source || steps.helper.outputs.agent-system-source }}
          PRIVATE_KEY: ${{ steps.setup.outputs.private-key-path || steps.helper.outputs.private-key-path }}
          PUBLIC_KEY: ${{ steps.setup.outputs.public-key-path || steps.helper.outputs.public-key-path }}
          DBUS_ADDRESS: ${{ steps.setup.outputs.dbus-address || steps.helper.outputs.dbus-address }}
          GATEWAY_LOG_PATH: ${{ steps.setup.outputs.gateway-log-path || steps.helper.outputs.gateway-log-path }}
          SELECTION: ${{ matrix.selection }}
        run: |
          set -euo pipefail
          test "$MODE" = setup
          test "$GATEWAY_LOG_PATH" = "$OPENCLAW_GATEWAY_LOG_PATH"
          test "$GATEWAY_LOG_PATH" = "$SETUP_OPENCLAW_STATE_DIR/gateway/gateway.log"
          test "$VERSION" = 0.6.0
          test -f "$ARTIFACT"
          test -d "$PLUGIN_PATH"
          test "$PRIVATE_KEY" = "$HOME/.ssh/big-test-bucket-ssh"
          test -s "$PRIVATE_KEY"
          test -s "$PUBLIC_KEY"
          ssh-keygen -y -f "$PRIVATE_KEY" | cut -d ' ' -f 1,2 > "$RUNNER_TEMP/derived-key"
          cut -d ' ' -f 1,2 "$PUBLIC_KEY" > "$RUNNER_TEMP/public-key"
          diff "$RUNNER_TEMP/derived-key" "$RUNNER_TEMP/public-key"
          if [[ "$RUNNER_OS" == Linux ]]; then
            test "$DBUS_ADDRESS" = "$DBUS_SESSION_BUS_ADDRESS"
            printf fixture | timeout 3 secret-tool store --label=fixture harness readback
            test "$(timeout 3 secret-tool lookup harness readback)" = fixture
            timeout 3 secret-tool clear harness readback
          else
            test -z "$DBUS_ADDRESS"
          fi
          openclaw config validate --json > "$RUNNER_TEMP/config.json"
          openclaw plugins inspect agent-system --runtime --json > "$RUNNER_TEMP/plugin.json"
          node -e '
            const fs = require("node:fs");
            const assert = require("node:assert/strict");
            const report = JSON.parse(fs.readFileSync(process.argv[1]));
            assert.equal(report.plugin.id, "agent-system");
            assert.equal(report.plugin.status, "loaded");
            assert.equal(report.plugin.enabled, true);
            assert.equal(report.plugin.version, "0.6.0");
            assert.equal(report.install.sourcePath, process.env.ARTIFACT);
            assert.equal(report.policy.allowConversationAccess, true);
            assert.ok(report.typedHooks.some(hook => hook.name === "before_prompt_build"));
          ' "$RUNNER_TEMP/plugin.json"
          if [[ "$SELECTION" == source ]]; then
            test "$(shasum -a 256 agent-system-source/README.md | cut -d ' ' -f 1)" = "$SOURCE_README_HASH"
            test "$(tar -xOf "$ARTIFACT" package/assets/harness-marker.txt)" = 'local source marker'
            test ! -d agent-system-source/node_modules
          elif [[ "$SELECTION" == tarball ]]; then
            test "$ARTIFACT" = "$LOCAL_PACKAGE"
            test "$SETUP_OPENCLAW_DEBUG" = false
          elif [[ "$SELECTION" == published ]]; then
            test "$SOURCE" = npm:@tanaab/openclaw-agent-system@0.6.0
          else
            test "$SOURCE" = github:tanaabased/openclaw-agent-system#4fc7dd6abab9d511d4a6a899b65305b74e4eec7b
          fi
          OPENCLAW_LOG_LEVEL=debug openclaw-gateway start
          test -s "$GATEWAY_LOG_PATH"
          grep --fixed-strings --quiet manifest_loaded "$GATEWAY_LOG_PATH"
          openclaw gateway call agents.list --json --timeout 3000
          openclaw-gateway stop
      - name: Clean gateway
        if: always()
        run: |
          if test -f "$SETUP_OPENCLAW_STATE_DIR/context"; then openclaw-gateway stop; fi
