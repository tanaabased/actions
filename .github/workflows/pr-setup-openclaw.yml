name: PR / setup-openclaw

on:
  pull_request:

permissions:
  contents: read

jobs:
  setup-openclaw:
    name: setup-openclaw (${{ matrix.os }} / ${{ matrix.selection }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
        selection:
          - explicit
          - auto
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Verify debug contract
        run: bash scripts/check-debug-contract.sh setup-openclaw
      - name: Install OpenClaw
        id: openclaw
        uses: ./setup-openclaw
        env:
          RUNNER_DEBUG: '1'
        with:
          test-mode: true
          debug: ${{ matrix.selection == 'explicit' && 'false' || 'auto' }}
          version: ${{ matrix.selection == 'explicit' && '2026.9.3' || 'auto' }}
          package-json: ${{ matrix.selection == 'explicit' && 'setup-openclaw/test/fixture/conflict-package.json' || 'setup-openclaw/test/fixture/dependency-package.json' }}
      - name: Verify installation and exported commands
        shell: bash
        env:
          EXECUTABLE_PATH: ${{ steps.openclaw.outputs.executable-path }}
          EXPECTED_DEBUG: ${{ matrix.selection == 'explicit' && 'false' || 'true' }}
          HELPER_PATH: ${{ steps.openclaw.outputs.helper-path }}
          RESOLVED_VERSION: ${{ steps.openclaw.outputs.version }}
          SELECTION: ${{ matrix.selection }}
        run: |
          set -euo pipefail

          test "$RESOLVED_VERSION" = '2026.9.3'
          test "$SETUP_OPENCLAW_DEBUG" = "$EXPECTED_DEBUG"
          test "$(command -v openclaw)" = "$EXECUTABLE_PATH"
          test "$(command -v openclaw-setup)" = "$HELPER_PATH/openclaw-setup"
          test "$(command -v openclaw-gateway)" = "$HELPER_PATH/openclaw-gateway"
          test "$(command -v openclaw-diagnostics)" = "$HELPER_PATH/openclaw-diagnostics"
          openclaw --version | grep --fixed-strings "$RESOLVED_VERSION"

          profile="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SELECTION"
          workspace="$RUNNER_TEMP/setup-openclaw-$SELECTION-workspace"
          state_dir="$RUNNER_TEMP/setup-openclaw-$SELECTION-state"
          {
            echo "OPENCLAW_TEST_PROFILE=$profile"
            echo "OPENCLAW_TEST_WORKSPACE=$workspace"
            echo "OPENCLAW_TEST_STATE_DIR=$state_dir"
          } >> "$GITHUB_ENV"

          openclaw-setup \
            --profile "$profile" \
            --workspace "$workspace" \
            --state-dir "$state_dir"
          openclaw-gateway start \
            --profile "$profile" \
            --workspace "$workspace" \
            --state-dir "$state_dir" \
            --timeout 90
          gateway_pid="$(cat "$state_dir/gateway/gateway.pid")"
          echo "OPENCLAW_TEST_GATEWAY_PID=$gateway_pid" >> "$GITHUB_ENV"

      - name: Verify later-step readiness and failure preservation
        shell: bash
        run: |
          set -euo pipefail

          test "$OPENCLAW_PROFILE" = "$OPENCLAW_TEST_PROFILE"
          test "$OPENCLAW_CONFIG_PATH" = "$OPENCLAW_TEST_STATE_DIR/openclaw/openclaw.json"
          test "$OPENCLAW_STATE_DIR" = "$OPENCLAW_TEST_STATE_DIR/openclaw"
          openclaw-gateway wait \
            --profile "$OPENCLAW_TEST_PROFILE" \
            --workspace "$OPENCLAW_TEST_WORKSPACE" \
            --state-dir "$OPENCLAW_TEST_STATE_DIR" \
            --timeout 30

          set +e
          openclaw-diagnostics \
            --profile "$OPENCLAW_TEST_PROFILE" \
            --workspace "$OPENCLAW_TEST_WORKSPACE" \
            --state-dir "$OPENCLAW_TEST_STATE_DIR" \
            --exit-code 23
          diagnostic_status=$?
          set -e
          test "$diagnostic_status" = 23

      - name: Stop isolated gateway
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if command -v openclaw-gateway >/dev/null 2>&1 && [[ -n "${OPENCLAW_TEST_STATE_DIR:-}" ]]; then
            openclaw-gateway stop \
              --profile "$OPENCLAW_TEST_PROFILE" \
              --workspace "$OPENCLAW_TEST_WORKSPACE" \
              --state-dir "$OPENCLAW_TEST_STATE_DIR" \
              --timeout 30
            test ! -f "$OPENCLAW_TEST_STATE_DIR/gateway/gateway.pid"
            if [[ -n "${OPENCLAW_TEST_GATEWAY_PID:-}" ]]; then
              if kill -0 "$OPENCLAW_TEST_GATEWAY_PID" 2>/dev/null; then
                exit 1
              fi
            fi
          fi

  version-resolution:
    name: setup-openclaw version resolution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Verify version selection contract
        shell: bash
        run: |
          set -euo pipefail

          resolver="$GITHUB_WORKSPACE/setup-openclaw/scripts/lib/resolve-openclaw.mjs"
          fixture_dir="$GITHUB_WORKSPACE/setup-openclaw/test/fixture"

          resolve_version() {
            local version="$1"
            local fixture="$2"
            local field="$3"
            node "$resolver" "$version" "$fixture_dir/$fixture" "$field" | sed -n '1p'
          }

          test "$(resolve_version auto package.json '')" = '2026.9.3'
          test "$(resolve_version auto dependency-package.json '')" = '2026.9.3'
          test "$(resolve_version auto matching-package.json '')" = '2026.9.3'
          test "$(resolve_version auto field-package.json 'openclaw.testedVersion')" = '2026.9.3'
          test "$(resolve_version 2026.9.3 conflict-package.json '')" = '2026.9.3'

  invalid-inputs:
    name: setup-openclaw invalid inputs (${{ matrix.os }} / ${{ matrix.case }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
        case:
          - dist-tag
          - conflict
          - missing
          - peer-only
          - missing-field
          - debug
          - test-mode
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Reject invalid input
        id: invalid
        continue-on-error: true
        uses: ./setup-openclaw
        with:
          test-mode: ${{ matrix.case == 'test-mode' && 'maybe' || 'true' }}
          debug: ${{ matrix.case == 'debug' && 'verbose' || 'false' }}
          version: ${{ matrix.case == 'dist-tag' && 'latest' || 'auto' }}
          package-json: ${{ matrix.case == 'conflict' && 'setup-openclaw/test/fixture/conflict-package.json' || matrix.case == 'missing' && 'setup-openclaw/test/fixture/missing-package.json' || matrix.case == 'peer-only' && 'setup-openclaw/test/fixture/peer-package.json' || 'setup-openclaw/test/fixture/package.json' }}
          package-field: ${{ matrix.case == 'missing-field' && 'dependencies.openclaw' || '' }}
      - name: Verify rejection
        env:
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
        run: test "$INVALID_OUTCOME" = failure
