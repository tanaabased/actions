name: Component tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: ./setup-node
      - name: Set up Bun
        uses: ./setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint resolver and tests
        run: bun run lint
      - name: Run component tests
        run: bun run test:component
