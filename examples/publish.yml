name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish as a GitHub release.
        required: true
        type: string

jobs:
  publish-npm:
    uses: tanaabased/actions/.github/workflows/publish-npm.yml@v1
    with:
      package-directory: .
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  publish-repo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: tanaabased/actions/actions/publish-repo@v1
        with:
          sync-tags: v1
          sync-token: ${{ secrets.RELEASE_SYNC_TOKEN }}
          version: ${{ inputs.tag }}
