name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish as a GitHub release.
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release files
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: bun install --frozen-lockfile && bun run build && bun run format
          version: ${{ inputs.tag }}
      - name: Pack package
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Test packed artifact
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
        run: |
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund "$TARBALL"
      - name: Publish tested tarball
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          update-prerelease-tag-on-stable: true
          channel-token: ${{ secrets.NPM_CHANNEL_TOKEN }}

  publish-repo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: tanaabased/actions/publish-repo@v1
        with:
          sync-tags: v1
          sync-token: ${{ secrets.RELEASE_SYNC_TOKEN }}
          version: ${{ inputs.tag }}
