name: Set up Agent System
description: Install Agent System from an exact release or source checkout into an isolated OpenClaw profile.

inputs:
  test-mode:
    description: Perform the same real isolated local installation without remote mutation or publication.
    required: false
    default: 'false'
  debug:
    description: Action and owned tool verbosity; auto follows RUNNER_DEBUG=1.
    required: false
    default: auto
  version:
    description: Exact published @tanaab/openclaw-agent-system version; mutually exclusive with source-directory.
    required: false
    default: ''
  source-directory:
    description: Agent System source checkout to build and pack; mutually exclusive with version.
    required: false
    default: ''
  profile:
    description: Isolated OpenClaw profile; omit the entire context tuple to use openclaw-setup exports.
    required: false
    default: ''
  config-path:
    description: OpenClaw configuration file for an explicitly supplied context tuple.
    required: false
    default: ''
  state-directory:
    description: OpenClaw state directory for an explicitly supplied context tuple.
    required: false
    default: ''

outputs:
  version:
    description: Exact installed Agent System package version.
    value: ${{ steps.artifact.outputs.version }}
  source:
    description: Exact npm package selector or canonical source directory used to prepare the artifact.
    value: ${{ steps.artifact.outputs.source }}
  artifact-path:
    description: Absolute path to the real npm tarball installed into OpenClaw.
    value: ${{ steps.artifact.outputs.artifact-path }}
  plugin-path:
    description: Absolute installed Agent System plugin directory reported by OpenClaw.
    value: ${{ steps.install.outputs.plugin-path }}

runs:
  using: composite
  steps:
    - id: debug
      name: Resolve debug mode
      shell: bash
      env:
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        effective_debug="$(bash "$GITHUB_ACTION_PATH/../scripts/resolve-debug.sh" "$DEBUG_INPUT")"
        echo "enabled=$effective_debug" >> "$GITHUB_OUTPUT"
        [[ "$effective_debug" != 'true' ]] || echo 'Diagnostics enabled for Agent System setup.'

    - id: resolve
      name: Validate Agent System selection
      shell: bash
      env:
        SELECTED_VERSION: ${{ inputs.version }}
        SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        TEST_MODE: ${{ inputs.test-mode }}
      run: |
        set -euo pipefail

        if [[ "$TEST_MODE" != 'true' && "$TEST_MODE" != 'false' ]]; then
          echo '::error::test-mode must be true or false'
          exit 2
        fi

        if [[ -n "$SELECTED_VERSION" && -n "$SOURCE_DIRECTORY" ]]; then
          echo '::error::version and source-directory are mutually exclusive'
          exit 2
        fi
        if [[ -z "$SELECTED_VERSION" && -z "$SOURCE_DIRECTORY" ]]; then
          echo '::error::exactly one of version or source-directory is required'
          exit 2
        fi

        if [[ -n "$SELECTED_VERSION" ]]; then
          resolved_version="$(node "$GITHUB_ACTION_PATH/scripts/package-contract.mjs" version "$SELECTED_VERSION")"
          {
            echo 'mode=published'
            echo "version=$resolved_version"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$SOURCE_DIRECTORY" == /* ]]; then
          source_path="$SOURCE_DIRECTORY"
        else
          source_path="$GITHUB_WORKSPACE/$SOURCE_DIRECTORY"
        fi
        [[ -d "$source_path" ]] || {
          echo "::error::source directory does not exist: $source_path"
          exit 2
        }
        source_path="$(cd "$source_path" && pwd -P)"
        [[ "$source_path" != *$'\n'* ]] || {
          echo '::error::source directory must not contain newlines'
          exit 2
        }

        contract_file="$(mktemp "$RUNNER_TEMP/setup-agent-system-contract.XXXXXX")"
        trap 'rm -f "$contract_file"' EXIT
        node "$GITHUB_ACTION_PATH/scripts/package-contract.mjs" source "$source_path" > "$contract_file"
        resolved_version="$(sed -n '1p' "$contract_file")"
        bun_version="$(sed -n '2p' "$contract_file")"
        [[ -n "$resolved_version" && -n "$bun_version" ]] || {
          echo '::error::source package contract returned an incomplete result'
          exit 1
        }

        {
          echo 'mode=source'
          echo "version=$resolved_version"
          echo "bun-version=$bun_version"
          echo "source-path=$source_path"
        } >> "$GITHUB_OUTPUT"

    - name: Set up source-selected Bun
      if: steps.resolve.outputs.mode == 'source'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.resolve.outputs.bun-version }}

    - id: artifact
      name: Prepare Agent System package
      shell: bash
      env:
        ACTION_DEBUG: ${{ steps.debug.outputs.enabled }}
        MODE: ${{ steps.resolve.outputs.mode }}
        NPM_CONFIG_LOGLEVEL: ${{ steps.debug.outputs.enabled == 'true' && 'verbose' || 'error' }}
        RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
        SOURCE_PATH: ${{ steps.resolve.outputs.source-path }}
      run: |
        set -euo pipefail

        artifact_dir="$(mktemp -d "$RUNNER_TEMP/setup-agent-system-artifact.XXXXXX")"
        staging_dir=''
        metadata_file=''
        archive_name=''
        selected_source=''
        cleanup_temporary_files() {
          primary_status=$?
          cleanup_status=0
          trap - EXIT

          if [[ -n "$staging_dir" ]] && ! rm -rf -- "$staging_dir"; then
            echo "::error::failed to remove source staging directory: $staging_dir"
            cleanup_status=1
          fi
          if [[ -n "$metadata_file" ]] && ! rm -f -- "$metadata_file"; then
            echo "::error::failed to remove package metadata file: $metadata_file"
            cleanup_status=1
          fi
          if ((primary_status != 0)) && ! rm -rf -- "$artifact_dir"; then
            echo "::error::failed to remove incomplete artifact directory: $artifact_dir"
            cleanup_status=1
          fi

          if ((primary_status != 0)); then
            exit "$primary_status"
          fi
          exit "$cleanup_status"
        }
        trap cleanup_temporary_files EXIT

        if [[ "$MODE" == 'published' ]]; then
          package_spec="@tanaab/openclaw-agent-system@$RESOLVED_VERSION"
          archive_name="$(npm pack --loglevel "$NPM_CONFIG_LOGLEVEL" --pack-destination "$artifact_dir" "$package_spec")"
          selected_source="npm:$package_spec"
        else
          staging_dir="$(mktemp -d "$RUNNER_TEMP/setup-agent-system-source.XXXXXX")"
          (
            cd "$SOURCE_PATH"
            tar --exclude=.git --exclude=node_modules --exclude=dist -cf - .
          ) | (
            cd "$staging_dir"
            tar -xf -
          )

          (
            cd "$staging_dir"
            bun_args=(install --frozen-lockfile --ignore-scripts)
            if [[ "$ACTION_DEBUG" == 'true' ]]; then
              bun_args+=(--verbose)
            fi
            bun "${bun_args[@]}"
            bun run build
            bun run plugin:check
          )
          archive_name="$(cd "$staging_dir" && npm pack --loglevel "$NPM_CONFIG_LOGLEVEL" --pack-destination "$artifact_dir")"
          selected_source="$SOURCE_PATH"
        fi

        [[ -n "$archive_name" && "$archive_name" != *$'\n'* ]] || {
          echo '::error::npm pack did not return one archive name'
          exit 1
        }
        artifact_path="$artifact_dir/$archive_name"
        [[ -f "$artifact_path" ]] || {
          echo "::error::Agent System package was not created: $artifact_path"
          exit 1
        }
        artifact_path="$(cd "$artifact_dir" && pwd -P)/$archive_name"

        metadata_file="$(mktemp "$RUNNER_TEMP/setup-agent-system-package.XXXXXX")"
        tar -xOf "$artifact_path" package/package.json > "$metadata_file"
        packed_version="$(node "$GITHUB_ACTION_PATH/scripts/package-contract.mjs" packed "$metadata_file" "$RESOLVED_VERSION")"

        {
          echo "version=$packed_version"
          echo "source=$selected_source"
          echo "artifact-path=$artifact_path"
        } >> "$GITHUB_OUTPUT"
        echo "Prepared Agent System $packed_version from $selected_source"

    - id: install
      name: Install and inspect Agent System
      shell: bash
      env:
        ACTION_DEBUG: ${{ steps.debug.outputs.enabled }}
        ARTIFACT_PATH: ${{ steps.artifact.outputs.artifact-path }}
        CONFIG_PATH_INPUT: ${{ inputs.config-path }}
        EXPECTED_VERSION: ${{ steps.artifact.outputs.version }}
        PROFILE_INPUT: ${{ inputs.profile }}
        STATE_DIRECTORY_INPUT: ${{ inputs.state-directory }}
      run: |
        set -euo pipefail

        explicit_context=0
        [[ -n "$PROFILE_INPUT" ]] && ((explicit_context += 1))
        [[ -n "$CONFIG_PATH_INPUT" ]] && ((explicit_context += 1))
        [[ -n "$STATE_DIRECTORY_INPUT" ]] && ((explicit_context += 1))

        if ((explicit_context == 0)); then
          profile="${OPENCLAW_PROFILE:-}"
          config_path="${OPENCLAW_CONFIG_PATH:-}"
          state_directory="${OPENCLAW_STATE_DIR:-}"
        elif ((explicit_context == 3)); then
          profile="$PROFILE_INPUT"
          config_path="$CONFIG_PATH_INPUT"
          state_directory="$STATE_DIRECTORY_INPUT"
        else
          echo '::error::profile, config-path, and state-directory must be supplied together'
          exit 2
        fi

        [[ "$profile" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ && "$profile" != 'default' ]] || {
          echo '::error::an isolated non-default OpenClaw profile is required'
          exit 2
        }
        [[ "$config_path" == /* && -f "$config_path" ]] || {
          echo "::error::OpenClaw config path must name an existing absolute file: $config_path"
          exit 2
        }
        [[ "$state_directory" == /* && -d "$state_directory" ]] || {
          echo "::error::OpenClaw state directory must name an existing absolute directory: $state_directory"
          exit 2
        }
        [[ "$config_path" != *$'\n'* && "$state_directory" != *$'\n'* ]] || {
          echo '::error::OpenClaw context paths must not contain newlines'
          exit 2
        }
        command -v openclaw >/dev/null 2>&1 || {
          echo '::error::openclaw is unavailable; run setup-openclaw or an equivalent setup first'
          exit 1
        }

        config_path="$(cd "$(dirname "$config_path")" && pwd -P)/$(basename "$config_path")"
        state_directory="$(cd "$state_directory" && pwd -P)"
        if [[ "$ACTION_DEBUG" == 'true' ]]; then
          openclaw_log_level=debug
        else
          openclaw_log_level=warn
        fi
        run_openclaw() {
          OPENCLAW_CONFIG_PATH="$config_path" \
            OPENCLAW_LOG_LEVEL="$openclaw_log_level" \
            OPENCLAW_STATE_DIR="$state_directory" \
            command openclaw --profile "$profile" "$@"
        }

        if run_openclaw plugins install "npm-pack:$ARTIFACT_PATH" --force --accept-capabilities; then
          install_status=0
        else
          install_status=$?
        fi
        if ((install_status != 0)); then
          echo "::error::Agent System installation failed with status $install_status"
          exit "$install_status"
        fi

        run_openclaw plugins enable agent-system
        run_openclaw config set plugins.entries.agent-system.hooks.allowConversationAccess true

        if validation_report="$(run_openclaw config validate --json)"; then
          validation_status=0
        else
          validation_status=$?
        fi
        if ((validation_status != 0)); then
          echo "::error::OpenClaw configuration validation failed with status $validation_status"
          exit "$validation_status"
        fi
        printf '%s\n' "$validation_report" \
          | node "$GITHUB_ACTION_PATH/scripts/verify-runtime.mjs" config

        if inspection_report="$(run_openclaw plugins inspect agent-system --runtime --json)"; then
          inspection_status=0
        else
          inspection_status=$?
        fi
        if ((inspection_status != 0)); then
          echo "::error::Agent System runtime inspection failed with status $inspection_status"
          exit "$inspection_status"
        fi
        plugin_path="$(printf '%s\n' "$inspection_report" \
          | node "$GITHUB_ACTION_PATH/scripts/verify-runtime.mjs" plugin "$EXPECTED_VERSION" "$ARTIFACT_PATH")"

        echo "plugin-path=$plugin_path" >> "$GITHUB_OUTPUT"
        echo "Installed and loaded Agent System $EXPECTED_VERSION from $ARTIFACT_PATH"
