name: Set up Bun
description: Select the caller's Bun version and delegate installation to oven-sh/setup-bun.

inputs:
  debug:
    description: Action diagnostics; auto follows RUNNER_DEBUG=1.
    default: auto
  bun-version:
    description: Explicit upstream version specification, or auto for project discovery.
    default: auto
  working-directory:
    description: Project directory for discovery, relative to the workspace or absolute.
    default: ${{ github.workspace }}

outputs:
  bun-version:
    description: Installed runtime version.
    value: ${{ steps.setup.outputs.bun-version }}
  version-spec:
    description: Version specification passed to the upstream installer.
    value: ${{ steps.resolve.outputs.version }}
  version-source:
    description: Input, project declaration, or fallback that selected the version.
    value: ${{ steps.resolve.outputs.source }}

runs:
  using: composite
  steps:
    - id: debug
      name: Resolve debug mode
      shell: bash
      env:
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        effective_debug="$(bash "$GITHUB_ACTION_PATH/../.lib/resolve-debug.sh" "$DEBUG_INPUT")"
        echo "enabled=$effective_debug" >> "$GITHUB_OUTPUT"
        [[ "$effective_debug" != 'true' ]] || echo 'Diagnostics enabled for bun setup.'

    - id: resolve
      name: Select runtime version
      shell: bash
      env:
        RUNTIME: bun
        RUNTIME_VERSION: ${{ inputs.bun-version }}
        PROJECT_DIRECTORY: ${{ inputs.working-directory }}
        ACTION_DEBUG: ${{ steps.debug.outputs.enabled }}
      run: |
        node "$GITHUB_ACTION_PATH/../.lib/resolve-runtime.mjs" >> "$GITHUB_OUTPUT"

    - id: setup
      name: Install selected runtime
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.resolve.outputs.version }}
