name: Set up OpenClaw
description: Install OpenClaw and prepare an isolated test harness through shared helpers.

inputs:
  debug:
    description: Action and helper verbosity; auto follows RUNNER_DEBUG=1.
    required: false
    default: auto
  version:
    description: OpenClaw version or range; auto discovers the package-tested declaration.
    required: false
    default: auto
  package-json:
    description: package.json used when version is auto, relative to the workspace or absolute.
    required: false
    default: package.json
  package-field:
    description: Optional dot-delimited package.json field overriding auto discovery.
    required: false
    default: ''

  run:
    description: Caller-owned multiline Bash commands; mutually exclusive with setup inputs.
    default: ''
  profile:
    description: Isolated non-default profile; defaults to a unique runner-temporary context.
    default: ''
  workspace:
    description: Absolute isolated agent workspace; defaults below the action context.
    default: ''
  state-dir:
    description: Absolute helper state directory; defaults below RUNNER_TEMP.
    default: ''
  model:
    description: Optional openai/model reference; requires OPENAI_API_KEY in the environment.
    default: ''
  agent-system:
    description: Exact version, local .tgz or source directory, or github:owner/repo#ref.
    default: ''
  needs-secret-service:
    description: true or false; prepare Linux Secret Service when true.
    default: ''
  needs-ssh-key:
    description: true or false; create the SSH fixture when true.
    default: ''
  op-cache:
    description: Agent System cache JSON; defaults to process-lifetime with 128 entries.
    default: ''
  yolo:
    description: true or false; allow unattended isolated tool execution when true.
    default: ''

outputs:
  version:
    description: Exact installed OpenClaw version after npm range resolution.
    value: ${{ steps.resolve.outputs.version }}
  executable-path:
    description: Absolute path to the installed OpenClaw executable.
    value: ${{ steps.install.outputs.executable-path }}
  helper-path:
    description: Absolute directory containing the supported public helper commands.
    value: ${{ steps.install.outputs.helper-path }}

  mode:
    description: Inferred install, setup, or run mode.
    value: ${{ steps.inputs.outputs.mode }}
  profile:
    description: Isolated OpenClaw profile.
    value: ${{ steps.context.outputs.profile }}
  workspace:
    description: Absolute isolated agent workspace.
    value: ${{ steps.context.outputs.workspace }}
  state-dir:
    description: Absolute helper state directory.
    value: ${{ steps.context.outputs.state-dir }}
  config-path:
    description: Absolute OpenClaw configuration path; created during setup.
    value: ${{ steps.context.outputs.config-path }}
  agent-system-version:
    description: Exact installed Agent System version in setup mode.
    value: ${{ steps.orchestrate.outputs.agent-system-version }}
  agent-system-source:
    description: Resolved package, path, or repository commit in setup mode.
    value: ${{ steps.orchestrate.outputs.agent-system-source }}
  agent-system-artifact-path:
    description: Agent System npm tarball in setup mode.
    value: ${{ steps.orchestrate.outputs.agent-system-artifact-path }}
  agent-system-plugin-path:
    description: Loaded Agent System plugin directory in setup mode.
    value: ${{ steps.orchestrate.outputs.agent-system-plugin-path }}
  private-key-path:
    description: SSH private-key path; never key contents.
    value: ${{ steps.orchestrate.outputs.private-key-path }}
  public-key-path:
    description: SSH public-key path.
    value: ${{ steps.orchestrate.outputs.public-key-path }}
  dbus-address:
    description: Linux Secret Service D-Bus address.
    value: ${{ steps.orchestrate.outputs.dbus-address }}
  secret-service-home:
    description: Isolated Linux Secret Service home.
    value: ${{ steps.orchestrate.outputs.secret-service-home }}

runs:
  using: composite
  steps:
    - id: inputs
      name: Validate setup and run modes
      shell: bash
      env:
        SETUP_RUN: ${{ inputs.run }}
        SETUP_PROFILE: ${{ inputs.profile }}
        SETUP_WORKSPACE: ${{ inputs.workspace }}
        SETUP_STATE_DIR: ${{ inputs.state-dir }}
        SETUP_MODEL: ${{ inputs.model }}
        SETUP_AGENT_SYSTEM: ${{ inputs.agent-system }}
        SETUP_NEEDS_SECRET_SERVICE: ${{ inputs.needs-secret-service }}
        SETUP_NEEDS_SSH_KEY: ${{ inputs.needs-ssh-key }}
        SETUP_OP_CACHE: ${{ inputs.op-cache }}
        SETUP_YOLO: ${{ inputs.yolo }}
      run: node "$GITHUB_ACTION_PATH/scripts/lib/action-inputs.mjs"

    - id: debug
      name: Resolve debug mode
      shell: bash
      env:
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        effective_debug="$(bash "$GITHUB_ACTION_PATH/../.lib/resolve-debug.sh" "$DEBUG_INPUT")"
        echo "enabled=$effective_debug" >> "$GITHUB_OUTPUT"
        echo "SETUP_OPENCLAW_DEBUG=$effective_debug" >> "$GITHUB_ENV"
        [[ "$effective_debug" != 'true' ]] || echo 'Diagnostics enabled for OpenClaw setup and exported helpers.'

    - id: resolve
      name: Resolve OpenClaw version and runtime
      shell: bash
      env:
        PACKAGE_FIELD: ${{ inputs.package-field }}
        PACKAGE_JSON: ${{ inputs.package-json }}
        VERSION_SPEC: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [[ "$PACKAGE_JSON" == /* ]]; then
          package_json_path="$PACKAGE_JSON"
        else
          package_json_path="$GITHUB_WORKSPACE/$PACKAGE_JSON"
        fi

        resolution_file="$(mktemp "$RUNNER_TEMP/setup-openclaw-resolution.XXXXXX")"
        trap 'rm -f "$resolution_file"' EXIT
        if ! node "$GITHUB_ACTION_PATH/scripts/lib/resolve-openclaw.mjs" \
          "$VERSION_SPEC" "$package_json_path" "$PACKAGE_FIELD" > "$resolution_file"; then
          echo '::error::OpenClaw version resolution failed'
          exit 1
        fi

        resolved_version="$(sed -n '1p' "$resolution_file")"
        node_range="$(sed -n '2p' "$resolution_file")"
        if [[ -z "$resolved_version" || -z "$node_range" ]]; then
          echo '::error::OpenClaw version resolution returned an incomplete result'
          exit 1
        fi

        echo "version=$resolved_version" >> "$GITHUB_OUTPUT"
        echo "node-range=$node_range" >> "$GITHUB_OUTPUT"
        if [[ "$SETUP_OPENCLAW_DEBUG" == 'true' ]]; then
          echo "Resolved OpenClaw $resolved_version with Node.js requirement $node_range"
        else
          echo "Resolved OpenClaw $resolved_version"
        fi

    - name: Set up compatible Node.js
      uses: $/setup-node
      with:
        debug: ${{ inputs.debug }}
        node-version: ${{ steps.resolve.outputs.node-range }}

    - id: install
      name: Install OpenClaw CLI and expose helpers
      shell: bash
      env:
        OPENCLAW_VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail

        install_root="$(mktemp -d "$RUNNER_TEMP/setup-openclaw.XXXXXX")"
        npm_args=(
          install
          --no-audit
          --no-fund
          --no-save
          --prefix "$install_root"
          "openclaw@$OPENCLAW_VERSION"
        )
        if [[ "$SETUP_OPENCLAW_DEBUG" == 'true' ]]; then
          npm_args+=(--loglevel verbose)
        else
          npm_args+=(--loglevel error)
        fi

        set +e
        npm "${npm_args[@]}"
        install_status=$?
        set -e
        if ((install_status != 0)); then
          echo "::error::OpenClaw $OPENCLAW_VERSION installation failed"
          rm -rf "$install_root"
          exit "$install_status"
        fi

        executable_path="$install_root/node_modules/.bin/openclaw"
        helper_path="$GITHUB_ACTION_PATH/scripts"
        if [[ ! -x "$executable_path" ]]; then
          echo "::error::Installed OpenClaw executable is unavailable: $executable_path"
          rm -rf "$install_root"
          exit 1
        fi

        installed_version="$(node -e \
          "const fs=require('node:fs');const p=require('node:path');process.stdout.write(JSON.parse(fs.readFileSync(p.join(process.argv[1],'node_modules/openclaw/package.json'),'utf8')).version)" \
          "$install_root")"
        if [[ "$installed_version" != "$OPENCLAW_VERSION" ]]; then
          echo "::error::Installed OpenClaw version $installed_version does not match resolved version $OPENCLAW_VERSION"
          rm -rf "$install_root"
          exit 1
        fi

        echo "$install_root/node_modules/.bin" >> "$GITHUB_PATH"
        echo "$helper_path" >> "$GITHUB_PATH"
        echo "executable-path=$executable_path" >> "$GITHUB_OUTPUT"
        echo "helper-path=$helper_path" >> "$GITHUB_OUTPUT"
        echo "Installed OpenClaw $installed_version"

    - id: context
      name: Establish isolated helper context
      shell: bash
      env:
        PROFILE_INPUT: ${{ inputs.profile }}
        WORKSPACE_INPUT: ${{ inputs.workspace }}
        STATE_INPUT: ${{ inputs.state-dir }}
      run: |
        set -euo pipefail
        context_root="$(mktemp -d "$RUNNER_TEMP/openclaw-context.XXXXXX")"
        context_id="$(basename "$context_root" | tr . -)"
        profile="${PROFILE_INPUT:-ci-$context_id}"
        state_dir="${STATE_INPUT:-$context_root}"
        workspace="${WORKSPACE_INPUT:-$state_dir/workspace}"
        {
          echo "OPENCLAW_PROFILE=$profile"
          echo "OPENCLAW_WORKSPACE=$workspace"
          echo "SETUP_OPENCLAW_STATE_DIR=$state_dir"
          echo "OPENCLAW_STATE_DIR=$state_dir/openclaw"
          echo "OPENCLAW_CONFIG_PATH=$state_dir/openclaw/openclaw.json"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unix:path=$state_dir/secret-service-bus}"
          echo "SSH_PRIVATE_KEY_PATH=$HOME/.ssh/big-test-bucket-ssh"
          echo "SSH_PUBLIC_KEY_PATH=$HOME/.ssh/big-test-bucket-ssh.pub"
        } >> "$GITHUB_ENV"
        {
          echo "profile=$profile"
          echo "workspace=$workspace"
          echo "state-dir=$state_dir"
          echo "config-path=$state_dir/openclaw/openclaw.json"
        } >> "$GITHUB_OUTPUT"

    - id: agent-system
      name: Resolve Agent System source
      if: inputs.agent-system != ''
      shell: bash
      env:
        AGENT_SYSTEM: ${{ inputs.agent-system }}
      run: |
        selection_file="$(mktemp "$RUNNER_TEMP/openclaw-selection.XXXXXX")"
        node "$GITHUB_ACTION_PATH/scripts/lib/agent-system.mjs" prepare "$AGENT_SYSTEM" "$selection_file"

    - name: Set up source-selected Bun
      if: steps.agent-system.outputs.bun-version != ''
      uses: $/setup-bun
      with:
        debug: ${{ inputs.debug }}
        bun-version: ${{ steps.agent-system.outputs.bun-version }}

    - id: orchestrate
      name: Run selected harness mode
      shell: bash
      env:
        HARNESS_MODE: ${{ steps.inputs.outputs.mode }}
        SETUP_OPENCLAW_SELECTION: ${{ steps.agent-system.outputs.selection-file }}
        SETUP_RUN: ${{ inputs.run }}
        SETUP_PROFILE: ${{ inputs.profile }}
        SETUP_WORKSPACE: ${{ inputs.workspace }}
        SETUP_STATE_DIR: ${{ inputs.state-dir }}
        SETUP_MODEL: ${{ inputs.model }}
        SETUP_AGENT_SYSTEM: ${{ inputs.agent-system }}
        SETUP_NEEDS_SECRET_SERVICE: ${{ inputs.needs-secret-service }}
        SETUP_NEEDS_SSH_KEY: ${{ inputs.needs-ssh-key }}
        SETUP_OP_CACHE: ${{ inputs.op-cache }}
        SETUP_YOLO: ${{ inputs.yolo }}
      run: |
        set -euo pipefail
        if [[ "$HARNESS_MODE" == setup ]]; then
          args=()
          for option in model agent-system needs-secret-service needs-ssh-key op-cache yolo; do
            variable="SETUP_$(printf '%s' "$option" | tr '[:lower:]-' '[:upper:]_')"
            value="${!variable}"
            [[ -z "$value" ]] || args+=("--$option" "$value")
          done
          openclaw-setup "${args[@]}"
        elif [[ "$HARNESS_MODE" == run ]]; then
          script="$(mktemp "$RUNNER_TEMP/openclaw-run.XXXXXX")"
          trap 'rm -f "$script"' EXIT
          printf '%s\n' "$SETUP_RUN" > "$script"
          bash --noprofile --norc -eo pipefail "$script"
        fi

    - name: Clean Agent System selection
      if: always() && steps.agent-system.outputs.selection-file != ''
      shell: bash
      env:
        SELECTION_FILE: ${{ steps.agent-system.outputs.selection-file }}
        AGENT_SYSTEM: ${{ inputs.agent-system }}
      run: |
        if [[ -f "$SELECTION_FILE" ]]; then
          node "$GITHUB_ACTION_PATH/scripts/lib/agent-system.mjs" cleanup "$AGENT_SYSTEM" "$SELECTION_FILE"
        fi
