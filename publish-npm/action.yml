name: Publish npm package
description: Publish one tested npm tarball to an npm-compatible registry.

inputs:
  dry-run:
    description: Validate the tarball with npm's native dry run without registry mutation or credentials.
    required: false
    default: 'false'
  debug:
    description: Action and npm verbosity; auto follows RUNNER_DEBUG=1.
    required: false
    default: auto
  tarball:
    description: Tested npm tarball to publish, relative to the workspace or absolute.
    required: true
  registry-url:
    description: npm-compatible registry URL.
    required: false
    default: https://registry.npmjs.org
  registry-token:
    description: Optional publication token for registries without trusted publishing; omit for supported npm trusted publishing.
    required: false
  channel-token:
    description: Optional edge-tag sync token; omit for supported npm trusted publishing.
    required: false
  latest-tag:
    description: Distribution tag used for GitHub Latest releases or stable SemVer fallback.
    required: false
  edge-tag:
    description: Distribution tag used for other releases or prerelease SemVer fallback.
    required: false
  sync-edge-tag:
    description: Move the edge tag after a latest-tag publication.
    required: false
  access:
    description: npm package access passed to npm publish; leave empty to use registry defaults.
    required: false
    default: public
  working-directory:
    description: Project directory for automatic runtime selection, relative to the workspace or absolute.
    required: false
    default: ${{ github.workspace }}
  node-version:
    description: Node.js version, or auto to discover it from working-directory.
    required: false
    default: auto
  npm-version:
    description: npm version range for publication.
    required: false
    default: '^11.21.0'

  # Deprecated aliases kept for v1 callers; remove only in a breaking release.
  stable-tag:
    description: Deprecated alias for latest-tag.
    required: false
  prerelease-tag:
    description: Deprecated alias for edge-tag.
    required: false
  update-prerelease-tag-on-stable:
    description: Deprecated alias for sync-edge-tag.
    required: false

outputs:
  tarball-path:
    description: Absolute path to the supplied tarball.
    value: ${{ steps.package.outputs.tarball-path }}
  package-name:
    description: Package name read from the supplied tarball.
    value: ${{ steps.package.outputs.package-name }}
  package-version:
    description: Package version read from the supplied tarball.
    value: ${{ steps.package.outputs.package-version }}
  channel:
    description: Distribution tag selected for the publication.
    value: ${{ steps.package.outputs.channel }}
  # Deprecated output kept for v1 callers; remove only in a breaking release.
  release-type:
    description: Deprecated SemVer syntax label; not GitHub release status or the selected npm tag.
    value: ${{ steps.package.outputs.release-type }}

runs:
  using: composite
  steps:
    - id: debug
      name: Resolve debug mode
      shell: bash
      env:
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        effective_debug="$(bash "$GITHUB_ACTION_PATH/../.lib/resolve-debug.sh" "$DEBUG_INPUT")"
        echo "enabled=$effective_debug" >> "$GITHUB_OUTPUT"
        [[ "$effective_debug" != 'true' ]] || echo 'Diagnostics enabled for npm publication.'

    - name: Validate dry run
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        if [[ "$DRY_RUN" != "true" && "$DRY_RUN" != "false" ]]; then
          echo "::error::dry-run must be true or false"
          exit 1
        fi

    - name: Set up Node.js
      uses: $/setup-node
      with:
        debug: ${{ inputs.debug }}
        working-directory: ${{ inputs.working-directory }}
        node-version: ${{ inputs.node-version }}

    - name: Install supported npm
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm-version }}
        NPM_CONFIG_LOGLEVEL: ${{ steps.debug.outputs.enabled == 'true' && 'verbose' || 'error' }}
      run: npm install --global "npm@$NPM_VERSION"

    - name: Validate supported npm
      shell: bash
      run: |
        installed_version="$(npm --version)"
        node - "$installed_version" <<'NODE'
        const version = process.argv[2];
        const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
        const supported = match && (
          (Number(match[1]) === 11 && Number(match[2]) >= 21) ||
          (Number(match[1]) === 12 && Number(match[2]) >= 2) ||
          Number(match[1]) >= 13
        );
        if (!supported) {
          console.error(`::error::Installed npm ${version} cannot use OIDC dist-tags; use npm 11.21.0+ in 11.x, 12.2.0+ in 12.x, or npm 13+.`);
          process.exitCode = 1;
        }
        NODE

    - id: package
      name: Inspect tarball
      shell: bash
      env:
        NPM_CONFIG_LOGLEVEL: ${{ steps.debug.outputs.enabled == 'true' && 'verbose' || 'error' }}
        GH_ENTERPRISE_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        EDGE_TAG: ${{ inputs.edge-tag }}
        LATEST_TAG: ${{ inputs.latest-tag }}
        LEGACY_PRERELEASE_TAG: ${{ inputs.prerelease-tag }}
        LEGACY_STABLE_TAG: ${{ inputs.stable-tag }}
        LEGACY_SYNC_EDGE_TAG: ${{ inputs.update-prerelease-tag-on-stable }}
        RELEASE_NODE_ID: ${{ github.event.release.node_id }}
        SYNC_EDGE_TAG: ${{ inputs.sync-edge-tag }}
        TARBALL: ${{ inputs.tarball }}
      run: |
        set -euo pipefail

        tarball_path="$(node -e "process.stdout.write(require('node:path').resolve(process.argv[1]))" "$TARBALL")"
        if [[ ! -f "$tarball_path" ]]; then
          echo "::error::npm tarball does not exist: $tarball_path"
          exit 1
        fi

        metadata_root="$(mktemp -d)"
        metadata_json="$metadata_root/package.json"
        trap 'rm -rf "$metadata_root"' EXIT

        (
          cd "$metadata_root"
          npm pack "$tarball_path" --dry-run --ignore-scripts --json --offline > "$metadata_json"
        )

        METADATA_JSON="$metadata_json" TARBALL_PATH="$tarball_path" node <<'NODE' >> "$GITHUB_OUTPUT"
        const { execFileSync } = require('node:child_process');
        const fs = require('node:fs');

        function resolveInput(preferredName, legacyName, preferredEnv, legacyEnv, fallback) {
          const current = process.env[preferredEnv] || '';
          const previous = process.env[legacyEnv] || '';
          if (current && previous && current !== previous) {
            throw new Error(`conflicting values for ${preferredName} and deprecated ${legacyName}`);
          }
          return current || previous || fallback;
        }

        const latestTag = resolveInput(
          'latest-tag', 'stable-tag', 'LATEST_TAG', 'LEGACY_STABLE_TAG', 'latest');
        const edgeTag = resolveInput(
          'edge-tag', 'prerelease-tag', 'EDGE_TAG', 'LEGACY_PRERELEASE_TAG', 'edge');
        const syncEdgeTag = resolveInput(
          'sync-edge-tag', 'update-prerelease-tag-on-stable',
          'SYNC_EDGE_TAG', 'LEGACY_SYNC_EDGE_TAG', 'true');
        if (!['true', 'false'].includes(syncEdgeTag)) {
          throw new Error('sync-edge-tag must be true or false');
        }

        const result = JSON.parse(fs.readFileSync(process.env.METADATA_JSON, 'utf8'));
        if (!Array.isArray(result) || result.length !== 1) {
          throw new Error(`tarball inspection must return exactly one package; received ${result.length ?? 'invalid output'}`);
        }

        const [{ name, version }] = result;
        if (!name || !version) {
          throw new Error('tarball inspection did not return package name and version');
        }

        const releaseType = version.split('+', 1)[0].includes('-') ? 'prerelease' : 'stable';
        let promoteBoth = releaseType === 'stable';
        if (process.env.GITHUB_EVENT_NAME === 'release') {
          if (!process.env.RELEASE_NODE_ID) {
            throw new Error('release event is missing its GitHub node ID');
          }
          const query = 'query($id: ID!) { node(id: $id) { __typename ... on Release { isLatest isPrerelease } } }';
          const response = JSON.parse(execFileSync('gh', [
            'api', 'graphql', '--hostname', new URL(process.env.GITHUB_SERVER_URL).host,
            '-f', `query=${query}`, '-F', `id=${process.env.RELEASE_NODE_ID}`,
          ], { encoding: 'utf8' }));
          const release = response.data?.node;
          if (response.errors?.length || release?.__typename !== 'Release' ||
              typeof release.isLatest !== 'boolean' || typeof release.isPrerelease !== 'boolean') {
            throw new Error('GitHub did not return a valid release status');
          }
          promoteBoth = release.isLatest && !release.isPrerelease;
        }
        const channel = promoteBoth ? latestTag : edgeTag;
        if (!channel) {
          throw new Error('npm distribution tag must not be empty');
        }

        process.stdout.write(`tarball-path=${process.env.TARBALL_PATH}\n`);
        process.stdout.write(`package-name=${name}\n`);
        process.stdout.write(`package-version=${version}\n`);
        process.stdout.write(`channel=${channel}\n`);
        process.stdout.write(`release-type=${releaseType}\n`);
        process.stdout.write(`promote-both=${promoteBoth}\n`);
        process.stdout.write(`edge-tag=${edgeTag}\n`);
        process.stdout.write(`sync-edge-tag=${syncEdgeTag}\n`);
        NODE

    - id: npm-config
      name: Configure registry access
      shell: bash
      env:
        CHANNEL_TOKEN: ${{ inputs.channel-token }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        REGISTRY_URL: ${{ inputs.registry-url }}
      run: |
        set -euo pipefail

        publish_config="$(mktemp "$RUNNER_TEMP/publish-npm.XXXXXX")"
        channel_config="$(mktemp "$RUNNER_TEMP/publish-npm-channel.XXXXXX")"
        auth_key="$(node -e '
          const url = new URL(process.argv[1]);
          const path = url.pathname.endsWith("/") ? url.pathname : `${url.pathname}/`;
          process.stdout.write(`//${url.host}${path}:_authToken`);
        ' "$REGISTRY_URL")"

        printf 'registry=%s\n' "$REGISTRY_URL" > "$publish_config"
        printf 'registry=%s\n' "$REGISTRY_URL" > "$channel_config"

        if [[ -n "$REGISTRY_TOKEN" ]]; then
          printf '%s=${NODE_AUTH_TOKEN}\n' "$auth_key" >> "$publish_config"
        fi
        if [[ -n "$CHANNEL_TOKEN" || -n "$REGISTRY_TOKEN" ]]; then
          printf '%s=${NODE_AUTH_TOKEN}\n' "$auth_key" >> "$channel_config"
        fi

        echo "publish-config=$publish_config" >> "$GITHUB_OUTPUT"
        echo "channel-config=$channel_config" >> "$GITHUB_OUTPUT"

    - name: Dry-run publication
      if: ${{ inputs.dry-run == 'true' }}
      shell: bash
      env:
        ACCESS: ${{ inputs.access }}
        CHANNEL: ${{ steps.package.outputs.channel }}
        NODE_AUTH_TOKEN: ${{ inputs.registry-token }}
        NPM_CONFIG_USERCONFIG: ${{ steps.npm-config.outputs.publish-config }}
        REGISTRY_URL: ${{ inputs.registry-url }}
        TARBALL_PATH: ${{ steps.package.outputs.tarball-path }}
        NPM_CONFIG_LOGLEVEL: ${{ steps.debug.outputs.enabled == 'true' && 'verbose' || 'error' }}
      run: |
        set -euo pipefail

        publish_args=(publish "$TARBALL_PATH" --dry-run --offline --ignore-scripts --tag "$CHANNEL" --registry "$REGISTRY_URL")
        if [[ -n "$ACCESS" ]]; then
          publish_args+=(--access "$ACCESS")
        fi
        npm "${publish_args[@]}"

    - name: Publish tarball
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        ACCESS: ${{ inputs.access }}
        CHANNEL: ${{ steps.package.outputs.channel }}
        NODE_AUTH_TOKEN: ${{ inputs.registry-token }}
        NPM_CONFIG_USERCONFIG: ${{ steps.npm-config.outputs.publish-config }}
        REGISTRY_URL: ${{ inputs.registry-url }}
        TARBALL_PATH: ${{ steps.package.outputs.tarball-path }}
        NPM_CONFIG_LOGLEVEL: ${{ steps.debug.outputs.enabled == 'true' && 'verbose' || 'error' }}
      run: |
        set -euo pipefail

        publish_args=(publish "$TARBALL_PATH" --ignore-scripts --tag "$CHANNEL" --registry "$REGISTRY_URL")
        if [[ -n "$ACCESS" ]]; then
          publish_args+=(--access "$ACCESS")
        fi

        npm "${publish_args[@]}"

    - name: Sync edge tag
      if: ${{ inputs.dry-run != 'true' && steps.package.outputs.sync-edge-tag == 'true' && steps.package.outputs.promote-both == 'true' }}
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.channel-token || inputs.registry-token }}
        NPM_CONFIG_USERCONFIG: ${{ steps.npm-config.outputs.channel-config }}
        NPM_CONFIG_LOGLEVEL: ${{ steps.debug.outputs.enabled == 'true' && 'verbose' || 'error' }}
        PACKAGE_NAME: ${{ steps.package.outputs.package-name }}
        PACKAGE_VERSION: ${{ steps.package.outputs.package-version }}
        EDGE_TAG: ${{ steps.package.outputs.edge-tag }}
        REGISTRY_URL: ${{ inputs.registry-url }}
      run: npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" "$EDGE_TAG" --registry "$REGISTRY_URL"

    - name: Remove temporary npm configuration
      if: always()
      shell: bash
      env:
        CHANNEL_CONFIG: ${{ steps.npm-config.outputs.channel-config }}
        PUBLISH_CONFIG: ${{ steps.npm-config.outputs.publish-config }}
      run: rm -f "$CHANNEL_CONFIG" "$PUBLISH_CONFIG"
