name: Validate Codex plugin
description: Validate one local Codex plugin against a pinned OpenAI validator snapshot.

inputs:
  test-mode:
    description: Exercise the action without mutating external state.
    required: false
    default: 'false'
  debug:
    description: Action and pip verbosity; auto follows RUNNER_DEBUG=1.
    required: false
    default: auto
  plugin-directory:
    description: Codex plugin root, relative to the workspace or absolute.
    required: false
    default: .
  python-version:
    description: Python version used to run the validator.
    required: false
    default: '3.13'

outputs:
  plugin-path:
    description: Absolute path to the validated plugin root.
    value: ${{ steps.inputs.outputs.plugin-path }}

runs:
  using: composite
  steps:
    - id: debug
      name: Resolve debug mode
      shell: bash
      env:
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        effective_debug="$(bash "$GITHUB_ACTION_PATH/../.lib/resolve-debug.sh" "$DEBUG_INPUT")"
        echo "enabled=$effective_debug" >> "$GITHUB_OUTPUT"
        [[ "$effective_debug" != 'true' ]] || echo 'Diagnostics enabled for Codex plugin validation.'

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install validator dependencies
      shell: bash
      env:
        PIP_VERBOSITY: ${{ steps.debug.outputs.enabled == 'true' && '--verbose' || '--quiet' }}
      run: python -m pip install --disable-pip-version-check "$PIP_VERBOSITY" 'PyYAML==6.0.2'

    - id: inputs
      name: Validate action inputs
      shell: bash
      env:
        PLUGIN_DIRECTORY: ${{ inputs.plugin-directory }}
        TEST_MODE: ${{ inputs.test-mode }}
        ACTION_DEBUG: ${{ steps.debug.outputs.enabled }}
      run: |
        set -euo pipefail

        if [[ "$TEST_MODE" != "true" && "$TEST_MODE" != "false" ]]; then
          echo "::error::test-mode must be true or false"
          exit 1
        fi

        if [[ ! -d "$PLUGIN_DIRECTORY" ]]; then
          echo "::error::plugin-directory does not exist: $PLUGIN_DIRECTORY"
          exit 1
        fi

        plugin_path="$(cd "$PLUGIN_DIRECTORY" && pwd -P)"
        echo "plugin-path=$plugin_path" >> "$GITHUB_OUTPUT"
        [[ "$ACTION_DEBUG" != 'true' ]] || echo "Validating Codex plugin at $plugin_path"

    - name: Validate plugin
      shell: bash
      env:
        PLUGIN_PATH: ${{ steps.inputs.outputs.plugin-path }}
      run: python "${{ github.action_path }}/scripts/validate_plugin.py" "$PLUGIN_PATH"
